<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestión BSMH - iPad & PC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; box-sizing: border-box; }
        body { margin: 10px; background-color: #f0f0f7; color: #1c1c1e; -webkit-tap-highlight-color: transparent; }
        .container { background: white; padding: 20px; border-radius: 12px; max-width: 950px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header-title { text-align: center; color: #004481; margin: 0 0 15px 0; font-size: 22px; font-weight: bold; }
        
        /* Contenedor agrupado superior con el mismo estilo que el listado de instrumentos */
        .header-card {
            border: 2px solid #004481;
            border-radius: 12px;
            background-color: #fcfcfd;
            padding: 15px;
            margin-bottom: 20px;
        }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        @media (max-width: 600px) { .info-grid { grid-template-columns: 1fr; } }
        
        .info-item { display: flex; align-items: center; border-bottom: 1px solid #e5e5ea; padding: 8px 0; }
        .info-item label { font-weight: bold; font-size: 13px; width: 90px; color: #004481; flex-shrink: 0; }
        input[type="text"], input[type="date"], input[type="time"], textarea { width: 100%; border: none; font-size: 16px; background: transparent; outline: none; color: #1c1c1e; }
        textarea { border-bottom: 1px solid #e5e5ea; margin-top: 5px; resize: none; width: 100%; }
        
        .section-header { background: #f2f2f7; padding: 10px 15px; font-weight: bold; display: flex; justify-content: space-between; border-radius: 8px; margin: 20px 0 10px 0; border-left: 5px solid #004481; }
        .count-badge { background: #004481; color: white; padding: 3px 10px; border-radius: 12px; font-size: 14px; }
        
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; min-width: 500px; }
        
        th { font-size: 11px; color: #8e8e93; text-transform: uppercase; padding: 10px; text-align: center; }
        td { padding: 12px 5px; border-bottom: 1px solid #f2f2f7; text-align: center; font-size: 15px; }
        .row-base { background-color: #f0f7ff; } 
        .row-refuerzo { background-color: #fff9f0; }
        .inst-name { text-align: left; font-weight: 600; width: 30%; color: #1c1c1e; min-width: 130px; }
        
        .inst-cell-content { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .select-voz { 
            background: white; 
            border: 1px solid #c7c7cc; 
            border-radius: 6px; 
            padding: 3px 6px; 
            font-size: 12px; 
            color: #004481; 
            font-weight: 600; 
            outline: none; 
            cursor: pointer; 
        }

        .stepper { display: flex; align-items: center; justify-content: center; gap: 4px; }
        .btn-step { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #007aff; background: white; font-size: 20px; font-weight: bold; color: #007aff; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; }
        input[type="number"].qty-input { width: 40px; text-align: center; font-size: 18px; font-weight: bold; border: none; background: transparent; color: #1c1c1e; -moz-appearance: textfield; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .desglose-container { margin-top: 25px; padding: 15px; border: 2px solid #004481; border-radius: 12px; background-color: #fcfcfd; }
        .desglose-title { margin: 0 0 10px 0; color: #004481; font-size: 16px; text-transform: uppercase; border-bottom: 1px solid #004481; padding-bottom: 5px; }
        
        .grid-agrupado { display: flex; flex-flow: row wrap; gap: 5px; }
        .item-agrupado { font-size: 14px; padding: 6px 10px; width: calc(33.33% - 5px); border-bottom: 1px solid #eee; color: #004481; }
        @media (max-width: 768px) { .item-agrupado { width: calc(50% - 5px); } }
        @media (max-width: 480px) { .item-agrupado { width: 100%; } }

        .resumen { background: #004481; color: white; padding: 20px; text-align: center; border-radius: 10px; margin-top: 15px; font-size: 17px; line-height: 1.6; }
        
        /* Contenedor de acciones adaptable: 1 fila en PC y rejilla en móviles */
        .actions { 
            margin-top: 20px; 
            display: flex;
            flex-direction: row;
            gap: 8px; 
            width: 100%;
        }
        
        button.main-btn { 
            flex: 1;
            padding: 12px 6px; 
            border: none; 
            border-radius: 10px; 
            font-size: 13px; 
            font-weight: bold; 
            color: white; 
            cursor: pointer; 
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            white-space: nowrap;
        }

        button.main-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* Botón de añadir fila */
        .btn-add-item {
            background: #007aff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            flex-grow: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            touch-action: manipulation;
        }
        .btn-add-item svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* Dispositivos móviles (iPhone vertical) */
        @media (max-width: 767px) {
            .actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            button.main-btn {
                padding: 16px;
                font-size: 15px;
                white-space: normal;
            }
            button.main-btn svg {
                width: 20px;
                height: 20px;
            }
        }
        
        .btn-print { background: #34c759; }
        .btn-pdf { background: #007aff; }
        .btn-save { background: #5856d6; }
        .btn-open { background: #ff9500; }
        .btn-clear { background: #ff3b30; }
        .btn-back { background: #8e8e93; }
        
        .add-panel { background: #e5e5ea; padding: 15px; border-radius: 12px; margin-top: 15px; }
        .add-panel-controls { display: flex; gap: 10px; flex-wrap: wrap; }
        .add-panel-controls input, .add-panel-controls select { flex: 1; min-width: 150px; background: white; border-radius: 8px; padding: 12px; border: 1px solid #ccc; font-size: 16px; }

        @media print { .no-print { display: none !important; } .container { box-shadow: none; border: none; width: 100%; } .grid-agrupado { display: block; } .item-agrupado { width: 50%; display: inline-block; } }
    </style>
</head>
<body>

<div class="container" id="contenido-pdf">
    <!-- Bloque agrupado de información técnica superior -->
    <div class="header-card">
        <h2 class="header-title">BANDA SINFÓNICA MUNICIPAL DE HUELVA</h2>
        
        <div class="info-grid">
            <div class="info-item"><label>TÍTULO:</label> <input type="text" id="input-titulo" placeholder=""></div>
            <div class="info-item"><label>FECHA:</label> <input type="date" id="fecha-actual"></div>
            <div class="info-item"><label>UBICACIÓN:</label> <input type="text" id="input-ubicacion" placeholder=""></div>
            <div class="info-item"><label>HORA:</label> <input type="time" id="hora-actual"></div>
        </div>
        
        <textarea rows="2" id="input-obs" placeholder="Observaciones"></textarea>
    </div>

    <div class="section-header">
        <span>BSMHuelva</span>
        <span class="count-badge">Componentes: <span id="subtotal-comp-base">0</span></span>
    </div>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th class="no-print" style="width:40px"></th>
                    <th style="text-align:left">Instrumento</th>
                    <th>Componentes</th>
                    <th>Atriles</th>
                    <th>Sillas</th>
                    <th class="no-print"></th>
                </tr>
            </thead>
            <tbody id="tabla-base"></tbody>
        </table>
    </div>

    <div class="section-header">
        <span>REFUERZOS</span>
        <span class="count-badge">Componentes: <span id="subtotal-comp-ref">0</span></span>
    </div>
    <div class="table-responsive">
        <table>
            <tbody id="tabla-refuerzo"></tbody>
        </table>
    </div>

    <div class="desglose-container">
        <h4 class="desglose-title">Listado Total de Instrumentos</h4>
        <div id="lista-agrupada" class="grid-agrupado"></div>
    </div>

    <div class="resumen" id="resumen-final">
        RESUMEN TOTAL:<br>
        <b><span id="total-comp">0</span> Componentes</b> (<span id="det-base">0</span> BSMHuelva y <span id="det-ref">0</span> Refuerzos)<br>
        <b><span id="total-atriles">0</span> Atriles y <span id="total-sillas">0</span> Sillas</b>
    </div>
</div>

<div class="container no-print add-panel">
    <h4 style="margin:0 0 10px 0; color:#004481;">Añadir Instrumento Extra</h4>
    <div class="add-panel-controls">
        <input type="text" id="nuevo-nombre" placeholder="Nombre instrumento">
        <select id="nuevo-tipo">
            <option value="base">BSMHuelva</option>
            <option value="refuerzo">Refuerzo</option>
        </select>
        <button class="btn-add-item" onclick="agregarFilaManual()">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <span>Añadir</span>
        </button>
    </div>
    <div class="actions">
        <button class="main-btn btn-back" onclick="window.history.go(-1); return false;">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            <span>VOLVER</span>
        </button>
        <button class="main-btn btn-print" onclick="imprimirSistema()">
            <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
            <span>IMPRIMIR</span>
        </button>
        <button class="main-btn btn-pdf" onclick="descargarPDF()">
            <svg viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z"/></svg>
            <span>GENERAR PDF</span>
        </button>
        <button class="main-btn btn-save" onclick="guardarPlantilla()">
            <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
            <span>GUARDAR</span>
        </button>
        <button class="main-btn btn-open" onclick="document.getElementById('fileInput').click()">
            <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
            <span>ABRIR</span>
        <button class="main-btn btn-clear" onclick="confirmarLimpiar()">
            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            <span>LIMPIAR</span>
        </button>
                </button>
        <input type="file" id="fileInput" style="display:none" accept=".json" onchange="abrirPlantilla(event)">
    </div>
</div>

<script>
    const ORDEN_INSTRUMENTOS = ["Flautas", "Oboes", "Requinto", "Clarinetes", "Fagotes", "Saxo Soprano", "Saxos Altos", "Saxos Tenores", "Saxos Barítonos", "Trompas", "Trompetas", "Fliscornos", "Trombones", "Bombardinos", "Tubas", "Percusión"];
    
    const listaBase = ["Flauta", "Oboe", "Requinto", "Clarinete Pral.", "Clarinete 1º", "Clarinete 2º", "Clarinete 3º", "Clarinete Bajo", "Saxo Alto 1º", "Saxo Alto 2º", "Saxo Tenor 1º", "Saxo Tenor 2º", "Trompa", "Trompeta 1ª", "Trompeta 2ª", "Fliscorno", "Trombón 1º", "Trombón 2º", "Tuba 1ª", "Tuba 2ª", "Timbales", "Caja", "Bombo y Platos"];
   
    const listaRefuerzos = ["Flauta", "Oboe", "Requinto", "Clarinete", "Fagot", "Saxo Soprano", "Saxo Alto", "Saxo Tenor", "Saxo Barítono", "Trompa", "Trompeta", "Fliscorno", "Trombón", "Bombardino", "Tuba", "Percusión"];

    const OPCIONES_VOCES = ["--", "Pral.", "1º", "2º", "3º", "4º", "5º", "6º", "1ª", "2ª", "3ª", "4ª", "5ª","6ª", "Piccolo", "Tenor", "Bajo",];

    function normalizarTexto(txt) {
        return (txt || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    }

    function obtenerPesoInstrumento(nombre) {
        let n = normalizarTexto(nombre);

        let grupos = [
            { clave: "flautin", peso: 100 },
            { clave: "piccolo", peso: 100 },
            { clave: "flauta", peso: 110 },
            { clave: "oboe", peso: 200 },
            { clave: "corno ingles", peso: 210 },
            { clave: "requinto", peso: 300 },
            { clave: "clarinete", peso: 400 },
            { clave: "fagot", peso: 500 },
            { clave: "contrafagot", peso: 510 },
            { clave: "saxo soprano", peso: 600 },
            { clave: "saxo alto", peso: 700 },
            { clave: "saxo tenor", peso: 800 },
            { clave: "saxo baritono", peso: 900 },
            { clave: "saxofon baritono", peso: 900 },
            { clave: "saxo bajo", peso: 950 },
            { clave: "trompa", peso: 1000 },
            { clave: "trompeta", peso: 1100 },
            { clave: "fliscorno", peso: 1200 },
            { clave: "trombon", peso: 1300 },
            { clave: "bombardino", peso: 1400 },
            { clave: "tuba", peso: 1500 },
            { clave: "timbal", peso: 1600 },
            { clave: "caja", peso: 1610 },
            { clave: "bombo", peso: 1620 },
            { clave: "plato", peso: 1630 },
            { clave: "percusion", peso: 1640 },
            { clave: "bateria", peso: 1650 }
        ];

        let basePeso = 2000;
        for (let g of grupos) {
            if (n.includes(g.clave)) {
                basePeso = g.peso;
                break;
            }
        }

        let subPeso = 50;
        if (n.includes("pral") || n.includes("principal")) subPeso = 10;
        else if (n.includes("1") || n.includes("1o") || n.includes("1a")) subPeso = 20;
        else if (n.includes("2") || n.includes("2o") || n.includes("2a")) subPeso = 30;
        else if (n.includes("3") || n.includes("3o") || n.includes("3a")) subPeso = 40;
        else if (n.includes("4") || n.includes("4o") || n.includes("4a")) subPeso = 50;
        else if (n.includes("5")) subPeso = 60;
        else if (n.includes("bajo")) subPeso = 80;

        return basePeso + subPeso;
    }

    function inicializar() {
        document.getElementById('tabla-base').innerHTML = '';
        document.getElementById('tabla-refuerzo').innerHTML = '';
        listaBase.forEach(inst => {
            let v = 1; let act = true;
            if(inst.includes("Bajo")) { v = 0; act = false; }
            if(inst.includes("Clarinete 1º")) { v = 2; act = true; }
            if(inst.includes("Bombo")) { v = 2; act = true; }
            crearFila(inst, 'base', act, v);
        });
        listaRefuerzos.forEach(inst => crearFila(inst, 'refuerzo', false, 0));
        calcularTotales();
    }

    function crearFila(nombre, tipo, activo, valor, atriles = null, sillas = null, vozSeleccionada = "") {
        const tabla = document.getElementById(tipo === 'base' ? 'tabla-base' : 'tabla-refuerzo');
        const tr = document.createElement('tr');
        tr.className = tipo === 'base' ? 'row-base' : 'row-refuerzo';
        tr.setAttribute('data-tipo', tipo);
        
        const check = activo ? 'checked' : '';
        
        let n = nombre.toLowerCase();
        let valorSilla = (sillas !== null) ? sillas : valor;
        let valorAtril = (atriles !== null) ? atriles : valor;

        if (sillas === null && (n.includes("timbales") || n.includes("caja") || n.includes("bombo") || n.includes("platos") || n.includes("percusion") || n.includes("percusión"))) {
            valorSilla = 0;
        }

        let contenidoNombre = `<span class="nombre-texto">${nombre}</span>`;
        if (tipo === 'refuerzo') {
            let optionsHTML = OPCIONES_VOCES.map(v => {
                let val = (v === "--") ? "" : v;
                let sel = (val === vozSeleccionada) ? "selected" : "";
                let label = (v === "--") ? "Voz..." : v;
                return `<option value="${val}" ${sel}>${label}</option>`;
            }).join('');
            
            contenidoNombre = `
                <div class="inst-cell-content">
                    <span class="nombre-texto">${nombre}</span>
                    <select class="select-voz no-print" onchange="calcularTotales()">${optionsHTML}</select>
                </div>
            `;
        }
        
        tr.innerHTML = `
            <td class="no-print"><input type="checkbox" ${check} onchange="toggleFila(this)" style="width:20px; height:20px;"></td>
            <td class="inst-name">${contenidoNombre}</td>
            <td>${crearStepper('comp', true, valor)}</td>
            <td>${crearStepper('atril', false, valorAtril)}</td>
            <td>${crearStepper('silla', false, valorSilla)}</td>
            <td class="no-print"><button style="color:red; border:none; background:none; font-size:24px; cursor:pointer; padding:0 10px;" onclick="this.closest('tr').remove(); calcularTotales();">✕</button></td>
        `;

        // Inserción ordenada según la jerarquía orquestal
        const nuevoPeso = obtenerPesoInstrumento(nombre);
        const filasExistentes = Array.from(tabla.querySelectorAll('tr'));
        let insertado = false;

        for (let fila of filasExistentes) {
            let nombreEl = fila.querySelector('.nombre-texto') || fila.querySelector('.inst-name');
            let nombreFila = nombreEl ? nombreEl.innerText.trim() : '';
            let pesoFila = obtenerPesoInstrumento(nombreFila);
            if (nuevoPeso < pesoFila) {
                tabla.insertBefore(tr, fila);
                insertado = true;
                break;
            }
        }

        if (!insertado) {
            tabla.appendChild(tr);
        }
    }

    function crearStepper(clase, esComp, valor) {
        return `<div class="stepper">
            <button class="btn-step no-print" onclick="step(this, -1, ${esComp})">-</button>
            <input type="number" class="qty-input ${clase}" value="${valor}" min="0" oninput="manualInput(this, ${esComp})">
            <button class="btn-step no-print" onclick="step(this, 1, ${esComp})">+</button>
        </div>`;
    }

    function step(btn, delta, esComp) {
        const input = btn.parentNode.querySelector('.qty-input');
        let n = (parseInt(input.value) || 0) + delta;
        if (n < 0) n = 0;
        input.value = n;
        actualizarFila(input.closest('tr'), n, esComp);
    }

    function manualInput(input, esComp) {
        let n = parseInt(input.value) || 0;
        if (n < 0) n = 0;
        actualizarFila(input.closest('tr'), n, esComp);
    }

    function actualizarFila(fila, n, esComp) {
        const cb = fila.querySelector('input[type="checkbox"]');
        if (n > 0) cb.checked = true;
        if (n === 0 && esComp) cb.checked = false;
        if (esComp) {
            fila.querySelector('.atril').value = n;
            let nombreEl = fila.querySelector('.nombre-texto') || fila.querySelector('.inst-name');
            let nombre = nombreEl.innerText.toLowerCase();
            if (!(nombre.includes("timbales") || nombre.includes("caja") || nombre.includes("bombo") || nombre.includes("platos") || nombre.includes("percusion") || nombre.includes("percusión"))) {
                fila.querySelector('.silla').value = n;
            }
        }
        calcularTotales();
    }

    function toggleFila(cb) {
        const fila = cb.closest('tr');
        const v = cb.checked ? 1 : 0;
        fila.querySelector('.comp').value = v;
        fila.querySelector('.atril').value = v;
        let nombreEl = fila.querySelector('.nombre-texto') || fila.querySelector('.inst-name');
        let nombre = nombreEl.innerText.toLowerCase();
        if (!(nombre.includes("timbales") || nombre.includes("caja") || nombre.includes("bombo") || nombre.includes("platos") || nombre.includes("percusion") || nombre.includes("percusión"))) {
            fila.querySelector('.silla').value = v;
        } else {
            fila.querySelector('.silla').value = 0;
        }
        calcularTotales();
    }

    function obtenerGrupo(nombre) {
        let n = nombre.toLowerCase();
        if (n.includes("flauta") || n.includes("flautín") || n.includes("flautin")) return "Flautas";
        if (n.includes("oboe")) return "Oboes";
        if (n.includes("requinto")) return "Requinto";
        if (n.includes("clarinete")) return "Clarinetes";
        if (n.includes("fagot")) return "Fagotes";
        if (n.includes("saxo soprano")) return "Saxo Soprano";
        if (n.includes("saxo alto")) return "Saxos Altos";
        if (n.includes("saxo tenor")) return "Saxos Tenores";
        if (n.includes("saxo barítono") || n.includes("saxo baritono")) return "Saxos Barítonos";
        if (n.includes("trompa")) return "Trompas";
        if (n.includes("trompeta")) return "Trompetas";
        if (n.includes("fliscorno")) return "Fliscornos";
        if (n.includes("trombón") || n.includes("trombon")) return "Trombones";
        if (n.includes("bombardino")) return "Bombardinos";
        if (n.includes("tuba")) return "Tubas";
        if (n.includes("percusion") || n.includes("percusión") || n.includes("timbales") || n.includes("caja") || n.includes("bombo") || n.includes("platos")) return "Percusión";
        return nombre;
    }

    function extraerVozBase(nombre) {
        let n = nombre.trim();
        let patrones = [
            /^Clarinete\s+/i,
            /^Saxo\s+Alto\s+/i,
            /^Saxo\s+Tenor\s+/i,
            /^Saxo\s+Barítono\s+/i,
            /^Saxo\s+Baritono\s+/i,
            /^Trompeta\s+/i,
            /^Trombón\s+/i,
            /^Trombon\s+/i,
            /^Tuba\s+/i,
            /^Flauta\s+/i,
            /^Oboe\s+/i,
            /^Trompa\s+/i,
            /^Bombardino\s+/i,
            /^Fliscorno\s+/i
        ];
        for (let regex of patrones) {
            if (regex.test(n)) {
                let voz = n.replace(regex, '').trim();
                if (voz) return voz;
            }
        }
        return "";
    }

    function calcularTotales() {
        let cBase = 0, cRef = 0, atr = 0, sil = 0;
        let grupos = {};
        
        document.querySelectorAll('tr[data-tipo]').forEach(fila => {
            if (fila.querySelector('input[type="checkbox"]').checked) {
                let c = parseInt(fila.querySelector('.comp').value) || 0;
                let a = parseInt(fila.querySelector('.atril').value) || 0;
                let s = parseInt(fila.querySelector('.silla').value) || 0;
                let tipo = fila.getAttribute('data-tipo');
                
                if (tipo === 'base') cBase += c; else cRef += c;
                atr += a; sil += s;
                
                if (c > 0) {
                    let nombreEl = fila.querySelector('.nombre-texto') || fila.querySelector('.inst-name');
                    let nombreInst = nombreEl.innerText.trim();
                    let g = obtenerGrupo(nombreInst);
                    
                    if (!grupos[g]) {
                        grupos[g] = { total: 0, voces: {} };
                    }
                    grupos[g].total += c;
                    
                    let vozFinal = "";
                    if (tipo === 'refuerzo') {
                        let selectVoz = fila.querySelector('.select-voz');
                        if (selectVoz && selectVoz.value) {
                            vozFinal = selectVoz.value;
                        }
                    } else {
                        vozFinal = extraerVozBase(nombreInst);
                    }
                    
                    let clave = vozFinal || "__DEFAULT__";
                    grupos[g].voces[clave] = (grupos[g].voces[clave] || 0) + c;
                }
            }
        });

        document.getElementById('subtotal-comp-base').innerText = cBase;
        document.getElementById('subtotal-comp-ref').innerText = cRef;
        document.getElementById('total-comp').innerText = cBase + cRef;
        document.getElementById('det-base').innerText = cBase;
        document.getElementById('det-ref').innerText = cRef;
        document.getElementById('total-atriles').innerText = atr;
        document.getElementById('total-sillas').innerText = sil;

        const listaDiv = document.getElementById('lista-agrupada');
        listaDiv.innerHTML = '';
        
        Object.keys(grupos).sort((a,b) => {
            let ia = ORDEN_INSTRUMENTOS.indexOf(a); let ib = ORDEN_INSTRUMENTOS.indexOf(b);
            return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
        }).forEach(g => {
            let infoGrupo = grupos[g];
            let clavesVoces = Object.keys(infoGrupo.voces);
            let textoVoces = "";
            
            let vocesValidas = clavesVoces.filter(v => v !== "__DEFAULT__");
            let hayMultiplesVoces = (clavesVoces.length >= 2) || (vocesValidas.length >= 1 && clavesVoces.includes("__DEFAULT__") && clavesVoces.length >= 2);

            if (hayMultiplesVoces) {
                let ordenVoces = ["Pral.", "1º", "2º", "3º", "4º", "5º", "6º", "1ª", "2ª", "3ª", "4ª", "5ª","6ª", "Piccolo", "Tenor", "Bajo"];
                clavesVoces.sort((v1, v2) => {
                    if (v1 === "__DEFAULT__") return 1;
                    if (v2 === "__DEFAULT__") return -1;
                    let idx1 = ordenVoces.indexOf(v1);
                    let idx2 = ordenVoces.indexOf(v2);
                    if (idx1 !== -1 && idx2 !== -1) return idx1 - idx2;
                    if (idx1 !== -1) return -1;
                    if (idx2 !== -1) return 1;
                    return v1.localeCompare(v2);
                });
                
                let arrVoces = clavesVoces.map(v => {
                    let etiqueta = (v === "__DEFAULT__") ? "Tutti" : v;
                    return `${infoGrupo.voces[v]}x${etiqueta}`;
                });
                textoVoces = ` <span style="font-weight:normal; font-size:12px; color:#555;">(${arrVoces.join(' | ')})</span>`;
            }

            listaDiv.innerHTML += `<div class="item-agrupado"><b>${infoGrupo.total}</b> ${g}${textoVoces}</div>`;
        });
    }

    function agregarFilaManual() {
        const n = document.getElementById('nuevo-nombre').value.trim();
        const t = document.getElementById('nuevo-tipo').value;
        if(n) { 
            crearFila(n, t, true, 1); 
            document.getElementById('nuevo-nombre').value = ''; 
            calcularTotales(); 
        }
    }

    function prepararHTMLInforme() {
        const fechaInput = document.getElementById('fecha-actual').value;
        let fechaFormateada = "--";
        if (fechaInput) {
            const fechaObj = new Date(fechaInput + 'T00:00:00');
            fechaFormateada = fechaObj.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            fechaFormateada = fechaFormateada.charAt(0).toUpperCase() + fechaFormateada.slice(1);
        }

        const titulo = document.getElementById('input-titulo').value || 'Sin concierto';
        const ubicacion = document.getElementById('input-ubicacion').value || 'Sin lugar';
        const hora = document.getElementById('hora-actual').value || '--';
        const obs = document.getElementById('input-obs').value.replace(/\n/g, '<br>') || 'Ninguna';

        const prioridad = ["Flauta", "Oboe", "Requinto", "Clarinete", "Fagot", "Saxo Soprano", "Saxo Alto", "Saxo Tenor", "Saxo Barítono", "Trompa", "Trompeta", "Fliscorno", "Trombón", "Bombardino", "Tuba", "Timbales", "Caja", "Bombo", "Percusión"];

        let todosLosInstrumentos = [];
        document.querySelectorAll('tr[data-tipo]').forEach(fila => {
            const comp = parseInt(fila.querySelector('.comp').value) || 0;
            if (fila.querySelector('input[type="checkbox"]').checked && comp > 0) {
                let nombreEl = fila.querySelector('.nombre-texto') || fila.querySelector('.inst-name');
                let nombreFinal = nombreEl.innerText.trim();
                let tipo = fila.getAttribute('data-tipo');
                
                if (tipo === 'refuerzo') {
                    let selectVoz = fila.querySelector('.select-voz');
                    if (selectVoz && selectVoz.value) {
                        nombreFinal += ` (${selectVoz.value})`;
                    }
                }

                todosLosInstrumentos.push({
                    nombre: nombreFinal,
                    seccion: tipo === 'base' ? 'BSMH' : 'Refuerzo',
                    comp: comp,
                    atriles: fila.querySelector('.atril').value,
                    sillas: fila.querySelector('.silla').value
                });
            }
        });

        todosLosInstrumentos.sort((a, b) => {
            let indexA = prioridad.findIndex(p => a.nombre.includes(p));
            let indexB = prioridad.findIndex(p => b.nombre.includes(p));
            return (indexA === -1 ? 99 : indexA) - (indexB === -1 ? 99 : indexB);
        });

        let filasHTML = '';
        todosLosInstrumentos.forEach(inst => {
            const estiloFila = inst.seccion === 'Refuerzo' ? 'background-color: #fff4e6;' : '';
            filasHTML += `
                <tr style="${estiloFila}">
                    <td style="border: 1px solid #004481; padding: 3px; text-align:center; font-weight:bold;">${inst.comp}</td>
                    <td style="border: 1px solid #004481; padding: 3px; text-align:left;">${inst.nombre}</td>
                    <td style="border: 1px solid #004481; padding: 3px; text-align:center; font-size:10px;">${inst.seccion}</td>
                    <td style="border: 1px solid #004481; padding: 3px; text-align:center;">${inst.atriles}</td>
                    <td style="border: 1px solid #004481; padding: 3px; text-align:center;">${inst.sillas}</td>
                </tr>`;
        });

        const listaAgrupadaHTML = Array.from(document.querySelectorAll('#lista-agrupada .item-agrupado'))
            .map(el => `<div style="display:inline-block; width:48%; font-size:10px; border-bottom:1px solid #eee; padding:1px 0; margin-bottom:2px; vertical-align:top; color:#004481;">${el.innerHTML}</div>`)
            .join('');

        return `
            <div style="padding: 10px; font-family: Arial, sans-serif; color: #1c1c1e;">
                <div style="text-align: center; border-bottom: 2px solid #004481; margin-bottom: 10px;">
                    <h2 style="color: #004481; margin: 0; font-size: 16px;">BANDA SINFÓNICA MUNICIPAL DE HUELVA</h2>
                    <div style="font-size: 12px; font-weight: bold;">INFORME TÉCNICO DE ESCENARIO</div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 11px; margin-bottom: 10px;">
                    <div><b>TÍTULO:</b> ${titulo}</div>
                    <div><b>FECHA:</b> ${fechaFormateada}</div>
                    <div><b>UBICACIÓN:</b> ${ubicacion}</div>
                    <div><b>HORA:</b> ${hora} h.</div>
                </div>
                <div style="border: 1px solid #ccc; padding: 5px; font-size: 10px; margin-bottom: 10px; background: #f9f9f9;">
                    <b>OBSERVACIONES:</b> ${obs}
                </div>
                <table style="width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 15px;">
                    <thead>
                        <tr style="background: #004481; color: white;">
                            <th style="border: 1px solid #004481; width: 40px; padding: 4px;">C.</th>
                            <th style="border: 1px solid #004481; text-align:left; padding: 4px;">Instrumento</th>
                            <th style="border: 1px solid #004481; width: 70px; padding: 4px;">Sección</th>
                            <th style="border: 1px solid #004481; width: 50px; padding: 4px;">Atriles</th>
                            <th style="border: 1px solid #004481; width: 50px; padding: 4px;">Sillas</th>
                        </tr>
                    </thead>
                    <tbody>${filasHTML}</tbody>
                </table>
                
                <div style="page-break-inside: avoid; break-inside: avoid;">
                    <div style="border-top: 2px solid #004481; padding-top: 8px; margin-top: 10px;">
                        <h4 style="margin: 0 0 5px 0; font-size: 11px; color: #004481; text-transform: uppercase;">Listado Total de Instrumentos</h4>
                        <div style="display: block; width: 100%;">${listaAgrupadaHTML}</div>
                    </div>
                    <div style="margin-top: 10px; background: #f0f7ff; border: 2px solid #004481; padding: 8px; text-align: center; font-size: 12px; font-weight: bold; color: #004481; border-radius: 4px;">
                        TOTAL: ${document.getElementById('total-comp').innerText} Componentes | 
                        ${document.getElementById('total-atriles').innerText} Atriles | 
                        ${document.getElementById('total-sillas').innerText} Sillas
                    </div>
                </div>
            </div>`;
    }

    function descargarPDF() {
        const elemento = document.createElement('div');
        elemento.innerHTML = prepararHTMLInforme();
        const titulo = document.getElementById('input-titulo').value || 'Informe_BSMH';
        
        const opciones = {
            margin: [10, 10, 10, 10],
            filename: `${titulo}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { 
                scale: 2, 
                useCORS: true,
                logging: false,
                letterRendering: true
            },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };
        
        html2pdf().set(opciones).from(elemento).save();
    }

    function imprimirSistema() {
        const ventana = window.open('', '_blank');
        ventana.document.write(`<html><head><style>
            @page { size: A4 portrait; margin: 10mm; }
            body { margin: 0; padding: 0; }
        </style></head><body>${prepararHTMLInforme()}</body></html>`);
        ventana.document.close();
        ventana.onload = () => { setTimeout(() => { ventana.print(); ventana.close(); }, 500); };
    }

    function guardarPlantilla() {
        const datos = {
            titulo: document.getElementById('input-titulo').value,
            ubicacion: document.getElementById('input-ubicacion').value,
            fecha: document.getElementById('fecha-actual').value,
            hora: document.getElementById('hora-actual').value,
            observaciones: document.getElementById('input-obs').value,
            instrumentos: []
        };

        document.querySelectorAll('tr[data-tipo]').forEach(fila => {
            let nombreEl = fila.querySelector('.nombre-texto') || fila.querySelector('.inst-name');
            let selectVoz = fila.querySelector('.select-voz');
            datos.instrumentos.push({
                nombre: nombreEl.innerText.trim(),
                tipo: fila.getAttribute('data-tipo'),
                activo: fila.querySelector('input[type="checkbox"]').checked,
                comp: fila.querySelector('.comp').value,
                atril: fila.querySelector('.atril').value,
                silla: fila.querySelector('.silla').value,
                voz: selectVoz ? selectVoz.value : ""
            });
        });

        const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Plantilla y Refuerzos ${datos.titulo || 'BSMH'}.json`;
        a.click();
    }

    function abrirPlantilla(event) {
        const archivo = event.target.files[0];
        if (!archivo) return;

        const lector = new FileReader();
        lector.onload = function(e) {
            try {
                const datos = JSON.parse(e.target.result);
                document.getElementById('input-titulo').value = datos.titulo || '';
                document.getElementById('input-ubicacion').value = datos.ubicacion || '';
                document.getElementById('fecha-actual').value = datos.fecha || '';
                document.getElementById('hora-actual').value = datos.hora || '';
                document.getElementById('input-obs').value = datos.observaciones || '';

                document.getElementById('tabla-base').innerHTML = '';
                document.getElementById('tabla-refuerzo').innerHTML = '';

                datos.instrumentos.forEach(inst => {
                    crearFila(inst.nombre, inst.tipo, inst.activo, inst.comp, inst.atril, inst.silla, inst.voz || "");
                });

                calcularTotales();
                alert("Plantilla cargada correctamente");
            } catch (err) {
                alert("Error al leer el archivo JSON");
            }
        };
        lector.readAsText(archivo);
    }

    function confirmarLimpiar() { if(confirm("¿Vaciar todo?")) window.location.reload(); }

    window.onload = inicializar;
</script>
