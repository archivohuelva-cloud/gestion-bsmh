function deleteFromViewModal() {
  if (!viewingEventId) return;
  const ev = events.find(e => e.id === viewingEventId);
  if (!ev) return;

  const dateToDelete = viewingContextDate || ev.dateStart;
  const hasRange = ev.dateEnd && ev.dateEnd > ev.dateStart;
  const fechaStr = formatDisplayDateWithDay(dateToDelete);

  const promptMsg = hasRange
    ? `¿Deseas eliminar este evento únicamente del día ${fechaStr}?`
    : `¿Eliminar este evento del ${fechaStr}?`;

  if (!confirm(promptMsg)) return;

  pushState();
  removeEventForSpecificDate(viewingEventId, dateToDelete);
  saveEvents();
  closeModal('view-modal');
  showToast('Evento eliminado', 'info');
  render();
}

/* ═══════════════════════════════════════
   UBICACIÓN DINÁMICA & TRAYECTOS HANDLERS
═══════════════════════════════════════ */
function handleTrayectoTipoChange() {
  const tipo = document.getElementById('trayecto-tipo').value;
  const secGroup = document.getElementById('secondary-trayecto-group');
  const secLabel = document.getElementById('secondary-toggle-label');
  const lblPrimary = document.getElementById('lbl-ubi-primaria');
  const lblMainTime = document.getElementById('lbl-main-time-start');
  const lblSecTime = document.getElementById('lbl-secondary-time');

  if (tipo === 'Ida a') {
    lblPrimary.textContent = 'Lugar de Ida:';
    secGroup.style.display = 'flex';
    secLabel.textContent = '¿Hay vuelta posterior?';
    document.getElementById('lbl-secondary-select').textContent = 'Lugar de Vuelta:';
    lblMainTime.textContent = 'Hora de Ida';
    if (lblSecTime) lblSecTime.textContent = 'Hora de Vuelta:';
  } else if (tipo === 'Vuelta a') {
    lblPrimary.textContent = 'Lugar de Vuelta:';
    secGroup.style.display = 'flex';
    secLabel.textContent = '¿Hay ida previa?';
    document.getElementById('lbl-secondary-select').textContent = 'Lugar de Ida previa:';
    lblMainTime.textContent = 'Hora de Vuelta';
    if (lblSecTime) lblSecTime.textContent = 'Hora de Ida:';
  } else {
    lblPrimary.textContent = 'Lugar / Destino fijo:';
    secGroup.style.display = 'none';
    document.getElementById('has-secondary-checkbox').classList.remove('checked');
    document.getElementById('secondary-inputs').style.display = 'none';
    lblMainTime.textContent = currentMode === 'sala' ? 'Hora inicio' : 'Hora inicio';
  }
}

function handleUbicacionSelectChange() {
  const val = document.getElementById('ubicacion-select').value;
  const customInput = document.getElementById('ubicacion-custom');
  if (val === '_CUSTOM_') {
    customInput.style.display = 'block';
    customInput.focus();
  } else {
    customInput.style.display = 'none';
  }
}

function toggleSecondaryTrayecto() {
  const cb = document.getElementById('has-secondary-checkbox');
  cb.classList.toggle('checked');
  const inputs = document.getElementById('secondary-inputs');
  inputs.style.display = cb.classList.contains('checked') ? 'flex' : 'none';
}

function handleSecondaryUbicacionChange() {
  const val = document.getElementById('ubicacion-secondary-select').value;
  const customInput = document.getElementById('ubicacion-secondary-custom');
  if (val === '_CUSTOM_') {
    customInput.style.display = 'block';
    customInput.focus();
  } else {
    customInput.style.display = 'none';
  }
}

function getFormattedUbicacion() {
  if (currentMode === 'sala') return '';
  const tipo = document.getElementById('trayecto-tipo').value;
  const ubiSel = document.getElementById('ubicacion-select').value;
  const customVal = document.getElementById('ubicacion-custom').value.trim();

  let lugar = ubiSel === '_CUSTOM_' ? customVal : ubiSel;
  if (!lugar && !tipo) return '';

  if (tipo === 'Ubicación' || !tipo) {
    return lugar ? (tipo ? `${tipo} ${lugar}` : lugar) : '';
  }

  const hasSecondary = document.getElementById('has-secondary-checkbox').classList.contains('checked');
  if (!hasSecondary) {
    return `${tipo} ${lugar}`.trim();
  }

  const secSel = document.getElementById('ubicacion-secondary-select').value;
  const secCustom = document.getElementById('ubicacion-secondary-custom').value.trim();
  let secLugar = secSel === '_CUSTOM_' ? secCustom : (secSel || lugar);

  if (tipo === 'Ida a') {
    return `Ida a ${lugar} y vuelta a ${secLugar}`.trim();
  } else if (tipo === 'Vuelta a') {
    return `Ida a ${secLugar} y vuelta a ${lugar}`.trim();
  }

  return `${tipo} ${lugar}`.trim();
}

function setFormattedUbicacion(val, secTimeVal) {
  const tipoSel = document.getElementById('trayecto-tipo');
  const ubiSel = document.getElementById('ubicacion-select');
  const customInput = document.getElementById('ubicacion-custom');
  const secCb = document.getElementById('has-secondary-checkbox');
  const secSel = document.getElementById('ubicacion-secondary-select');
  const secCustom = document.getElementById('ubicacion-secondary-custom');
  const secInputs = document.getElementById('secondary-inputs');
  const secTime = document.getElementById('secondary-time');

  tipoSel.value = '';
  ubiSel.value = '';
  customInput.value = '';
  customInput.style.display = 'none';
  secCb.classList.remove('checked');
  secSel.value = '';
  secCustom.value = '';
  secCustom.style.display = 'none';
  secInputs.style.display = 'none';
  if (secTime) secTime.value = secTimeVal || '13:30';

  if (!val) {
    handleTrayectoTipoChange();
    return;
  }

  const presets = ['ALMACÉN BANDA', 'CASA COLÓN', 'GRAN TEATRO', 'LAZARETO', 'SALA B', 'SANTA FE'];

  if (val.startsWith('Ida a ') && val.includes(' y vuelta a ')) {
    tipoSel.value = 'Ida a';
    handleTrayectoTipoChange();
    secCb.classList.add('checked');
    secInputs.style.display = 'flex';

    const parts = val.replace('Ida a ', '').split(' y vuelta a ');
    const p1 = parts[0].trim();
    const p2 = (parts[1] || '').trim();

    if (presets.includes(p1.toUpperCase())) ubiSel.value = p1.toUpperCase();
    else { ubiSel.value = '_CUSTOM_'; customInput.value = p1; customInput.style.display = 'block'; }

    if (presets.includes(p2.toUpperCase())) secSel.value = p2.toUpperCase();
    else if (p2) { secSel.value = '_CUSTOM_'; secCustom.value = p2; secCustom.style.display = 'block'; }
    return;
  }

  if (val.startsWith('Ida a ')) {
    tipoSel.value = 'Ida a';
    handleTrayectoTipoChange();
    const p = val.replace('Ida a ', '').trim();
    if (presets.includes(p.toUpperCase())) ubiSel.value = p.toUpperCase();
    else { ubiSel.value = '_CUSTOM_'; customInput.value = p; customInput.style.display = 'block'; }
    return;
  }

  if (val.startsWith('Vuelta a ')) {
    tipoSel.value = 'Vuelta a';
    handleTrayectoTipoChange();
    const p = val.replace('Vuelta a ', '').trim();
    if (presets.includes(p.toUpperCase())) ubiSel.value = p.toUpperCase();
    else { ubiSel.value = '_CUSTOM_'; customInput.value = p; customInput.style.display = 'block'; }
    return;
  }

  if (val.startsWith('Ubicación ')) {
    tipoSel.value = 'Ubicación';
    handleTrayectoTipoChange();
    const p = val.replace('Ubicación ', '').trim();
    if (presets.includes(p.toUpperCase())) ubiSel.value = p.toUpperCase();
    else { ubiSel.value = '_CUSTOM_'; customInput.value = p; customInput.style.display = 'block'; }
    return;
  }

  if (presets.includes(val.toUpperCase())) {
    ubiSel.value = val.toUpperCase();
  } else {
    ubiSel.value = '_CUSTOM_';
    customInput.value = val;
    customInput.style.display = 'block';
  }
  handleTrayectoTipoChange();
}

/* ═══════════════════════════════════════
   /* VARIABLES DE ESTADO GLOBALES */
let currentAuth = 'no';
let currentAuthDate = null;

/* ═══════════════════════════════════════
   CONTROL DE MODOS (SALA, ACTUACIÓN, LOGÍSTICA)
═══════════════════════════════════════ */
function setMode(mode) {
  currentMode = mode;
  const boxSala = document.getElementById('box-sala');
  const boxActuacion = document.getElementById('box-actuacion');
  const boxLogistica = document.getElementById('box-logistica');
  const boxAuthCultura = document.getElementById('box-auth-cultura');
  const boxFestivo = document.getElementById('box-festivo');

  const tabSala = document.getElementById('btn-tab-sala');
  const tabActuacion = document.getElementById('btn-tab-actuacion');
  const tabLogistica = document.getElementById('btn-tab-logistica');
  const lblMainTime = document.getElementById('lbl-main-time-start');
  const hoursWrapper = document.getElementById('hours-config-wrapper');

  // Mostrar u ocultar cajas según el modo
  boxSala.style.display = (mode === 'sala') ? '' : 'none';
  
  // Si estamos en Actuaciones, la caja de tipo de actuación solo se muestra si Festivo es 'no'
  boxActuacion.style.display = (mode === 'actuacion' && isFestivo !== 'si') ? '' : 'none';
  
  boxLogistica.style.display = (mode === 'logistica') ? '' : 'none';

  // Mostrar Autorizado por cultura SOLO en Ensayo
  if (boxAuthCultura) boxAuthCultura.style.display = (mode === 'sala') ? '' : 'none';

  // Mostrar Festivo SOLO en Actuaciones
  if (boxFestivo) boxFestivo.style.display = (mode === 'actuacion') ? '' : 'none';

  // Visibilidad de horas: se ocultan si estamos en Actuaciones y es festivo Sí
  if (hoursWrapper) {
    hoursWrapper.style.display = (mode === 'actuacion' && isFestivo === 'si') ? 'none' : '';
  }

  // Estilos de botones superiores
  tabSala.style.borderColor = (mode === 'sala') ? 'var(--ensayo-blue)' : 'var(--border)';
  tabSala.style.color = (mode === 'sala') ? 'var(--ensayo-blue)' : 'var(--text)';

  tabActuacion.style.borderColor = (mode === 'actuacion') ? 'var(--actuacion-navy)' : 'var(--border)';
  tabActuacion.style.color = (mode === 'actuacion') ? 'var(--actuacion-navy)' : 'var(--text)';

  tabLogistica.style.borderColor = (mode === 'logistica') ? 'var(--transport-color)' : 'var(--border)';
  tabLogistica.style.color = (mode === 'logistica') ? 'var(--transport-color)' : 'var(--text)';

  if (mode === 'sala' || mode === 'actuacion') {
    lblMainTime.textContent = 'Hora inicio';
  } else {
    lblMainTime.textContent = 'Hora';
    if (!editingEventId) {
      selectLogisticsOption('transporte');
      document.getElementById('time-start').value = '08:30';
      isHourRange = false;
      updateHourRangeUI();
    }
  }
}

function selectLogisticsOption(type) {
  selectedLogisticsType = type;
  const options = ['transporte', 'mochila', 'montaje', 'desmontaje', 'montar_desmontar', 'desmontar_montar', 'retranquear'];
  options.forEach(opt => {
    const el = document.getElementById(`radio-${opt}`);
    if (el) el.classList.toggle('checked', type === opt);
  });
}

/* ═══════════════════════════════════════
   CONTROL DE AUTORIZACIÓN POR CULTURA (ENSAYOS)
═══════════════════════════════════════ */
function setAuthStatus(status, preservedTimestamp = null) {
  currentAuth = status;
  const btnNo = document.getElementById('btn-auth-no');
  const btnSi = document.getElementById('btn-auth-si');
  const displayLbl = document.getElementById('auth-timestamp-display');
  const dtContainer = document.getElementById('auth-datetime-container');
  const dtInput = document.getElementById('auth-datetime-input');

  if (status === 'si') {
    btnSi.classList.add('active-si');
    btnNo.classList.remove('active-no');
    
    const targetDate = preservedTimestamp ? new Date(preservedTimestamp) : new Date();
    const yyyy = targetDate.getFullYear();
    const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
    const dd = String(targetDate.getDate()).padStart(2, '0');
    const hh = String(targetDate.getHours()).padStart(2, '0');
    const min = String(targetDate.getMinutes()).padStart(2, '0');
    
    dtInput.value = `${yyyy}-${mm}-${dd}T${hh}:${min}`;
    dtContainer.style.display = 'block';
    displayLbl.innerHTML = `<span style="color:#16a34a;font-weight:700;">Autorizado</span>`;
  } else {
    btnNo.classList.add('active-no');
    btnSi.classList.remove('active-si');
    dtContainer.style.display = 'none';
    dtInput.value = '';
    currentAuthDate = null;
    displayLbl.innerHTML = `<span style="color:#dc2626;font-weight:600;">Pendiente de autorizar</span>`;
  }
}

/* ═══════════════════════════════════════
   CONTROL DE FESTIVO (ACTUACIONES)
═══════════════════════════════════════ */
function setFestivoStatus(status) {
  isFestivo = status;
  const btnNo = document.getElementById('btn-festivo-no');
  const btnSi = document.getElementById('btn-festivo-si');
  const displayLbl = document.getElementById('festivo-status-display');
  const hoursWrapper = document.getElementById('hours-config-wrapper');
  const boxActuacion = document.getElementById('box-actuacion');

  if (status === 'si') {
    btnSi.classList.add('active-si');
    btnNo.classList.remove('active-no');
    displayLbl.innerHTML = `<span style="color:#16a34a;font-weight:700;">Día Festivo (Libre todo el día)</span>`;
    
    // 1. Ocultar horas
    if (hoursWrapper && currentMode === 'actuacion') hoursWrapper.style.display = 'none';
    
    // 2. Ocultar bloque completo de tipo de actuación
    if (boxActuacion) boxActuacion.style.display = 'none';

    // 3. Deseleccionar opciones
    document.querySelectorAll('#actuacion-presets .sala-preset-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('actuacion-input').value = '';
    selectedActuacion = '';
  } else {
    btnNo.classList.add('active-no');
    btnSi.classList.remove('active-si');
    displayLbl.innerHTML = `<span style="color:var(--text-dim);">No festivo</span>`;
    
    // 1. Volver a mostrar horas
    if (hoursWrapper) hoursWrapper.style.display = '';
    
    // 2. Volver a mostrar bloque completo de tipo de actuación si estamos en Actuaciones
    if (boxActuacion && currentMode === 'actuacion') {
      boxActuacion.style.display = '';
      if (!selectedActuacion) {
        setActuacion('CONCIERTO');
      }
    }
  }
}

═══════════════════════════════════════ */
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function openAddModal(selectedDate, selectedHour) {
  editingEventId = null;
  document.getElementById('modal-title').textContent = 'Nuevo evento';
  document.getElementById('btn-delete-event').style.display = 'none';

  resetForm();
  const dateToSet = selectedDate || dateStr(new Date());
  document.getElementById('date-start').value = dateToSet;
  document.getElementById('date-end').value = dateToSet;
  
  if (selectedHour !== undefined) {
    const h = String(selectedHour).padStart(2, '0');
    document.getElementById('time-start').value = `${h}:15`;
    const endH = String(Math.min(23, parseInt(selectedHour) + 4)).padStart(2, '0');
    document.getElementById('time-end').value = `${endH}:15`;
  }

  openModal('add-modal');
}

function openEditModal(id) {
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  editingEventId = id;

  document.getElementById('modal-title').textContent = 'Editar evento';
  document.getElementById('btn-delete-event').style.display = '';

  if (ev.actuacion) {
    setMode('actuacion');
    setActuacion(ev.actuacion);
    setFestivoStatus(ev.festivo || 'no');
  } else if (ev.sala) {
    setMode('sala');
    setSala(ev.sala);
    setAuthStatus(ev.autorizadoCultura || 'no', ev.autorizadoFecha || null);
  } else {
    setMode('logistica');
    const t = ev.tipoLogistica || (ev.desmontaje ? 'desmontaje' : (ev.montaje ? 'montaje' : 'transporte'));
    selectLogisticsOption(t);
    setFormattedUbicacion(ev.ubicacion || '', ev.secondaryTime || null);
  }

  document.getElementById('date-start').value = ev.dateStart;
  document.getElementById('date-end').value = ev.dateEnd || ev.dateStart;
  document.getElementById('time-start').value = ev.timeStart || '09:15';
  document.getElementById('time-end').value = ev.timeEnd || '';
  document.getElementById('event-notes').value = ev.notes || '';

  isHourRange = !!ev.timeEnd;
  updateHourRangeUI();

  if (ev.dateEnd && ev.dateEnd !== ev.dateStart) {
    isRange = true;
    document.getElementById('range-checkbox').classList.add('checked');
    document.getElementById('date-end-group').style.display = '';
    document.getElementById('date-label-start').textContent = 'Fecha inicio';
  } else {
    isRange = false;
    document.getElementById('range-checkbox').classList.remove('checked');
    document.getElementById('date-end-group').style.display = 'none';
    document.getElementById('date-label-start').textContent = 'Fecha';
  }

  openModal('add-modal');
}

function resetForm() {
  isRange = false;
  isHourRange = true;
  setMode('sala');
  updateHourRangeUI();
  document.getElementById('range-checkbox').classList.remove('checked');
  document.getElementById('date-end-group').style.display = 'none';
  document.getElementById('date-label-start').textContent = 'Fecha';

  setSala('SALA B');
  document.getElementById('sala-input').value = 'SALA B';

  setActuacion('CONCIERTO');
  document.getElementById('actuacion-input').value = 'CONCIERTO';

  selectLogisticsOption('transporte');
  setFormattedUbicacion('', null);

  setAuthStatus('no');
  setFestivoStatus('no');

  document.getElementById('time-start').value = '09:15';
  document.getElementById('time-end').value = '13:15';
  document.getElementById('event-notes').value = '';
}

function toggleHourRange() {
  isHourRange = !isHourRange;
  updateHourRangeUI();
}

function updateHourRangeUI() {
  const cb = document.getElementById('hour-range-checkbox');
  const endGrp = document.getElementById('time-end-group');
  cb.classList.toggle('checked', isHourRange);
  endGrp.style.display = isHourRange ? '' : 'none';
}

/* ═══════════════════════════════════════
   GUARDAR EVENTO
═══════════════════════════════════════ */
function saveEvent() {
  const isSalaMode = currentMode === 'sala';
  const isActMode = currentMode === 'actuacion';
  const isLogMode = currentMode === 'logistica';

  const sala = isSalaMode ? document.getElementById('sala-input').value.trim().toUpperCase() : '';
  const actuacion = isActMode ? document.getElementById('actuacion-input').value.trim().toUpperCase() : '';

  const tipoLogistica = isLogMode ? selectedLogisticsType : null;
  const transport = isLogMode && selectedLogisticsType === 'transporte' ? 'si' : 'no';
  const montaje = isLogMode && (selectedLogisticsType === 'montaje' || selectedLogisticsType === 'montar_desmontar');
  const desmontaje = isLogMode && (selectedLogisticsType === 'desmontaje' || selectedLogisticsType === 'desmontar_montar');
  const ubicacion = isLogMode ? getFormattedUbicacion() : '';

  const hasSec = isLogMode && document.getElementById('has-secondary-checkbox').classList.contains('checked');
  const secondaryTime = hasSec ? document.getElementById('secondary-time').value : null;

  const dateStart = document.getElementById('date-start').value;
  const dateEnd = isRange ? document.getElementById('date-end').value : dateStart;
  
  // Si estamos en Actuaciones y es Festivo 'si', las horas son nulas
  const isCurrentlyFestivo = isActMode && (isFestivo === 'si');
  const timeStart = isCurrentlyFestivo ? null : document.getElementById('time-start').value;
  const timeEnd = (isCurrentlyFestivo || !isHourRange) ? null : document.getElementById('time-end').value;
  const notes = document.getElementById('event-notes').value.trim();

  // Guardar fecha de autorización en Ensayo
  const customAuthVal = document.getElementById('auth-datetime-input')?.value;
  const finalAuthDate = (isSalaMode && currentAuth === 'si' && customAuthVal) 
    ? new Date(customAuthVal).toISOString() 
    : null;

  if (isSalaMode && !sala) {
    showToast('Indica el nombre de la sala', 'error');
    return;
  }
  if (isActMode && !actuacion && !isCurrentlyFestivo) {
    showToast('Indica el nombre o tipo de actuación', 'error');
    return;
  }
  if (isLogMode && !tipoLogistica && !notes && !ubicacion) {
    showToast('Selecciona una opción de logística o una ubicación', 'error');
    return;
  }
  if (!dateStart) { showToast('Indica la fecha', 'error'); return; }
  if (isRange && dateEnd < dateStart) { showToast('La fecha fin debe ser posterior al inicio', 'error'); return; }

  pushState();

  const payload = {
    sala: isSalaMode ? sala : '',
    actuacion: isActMode ? actuacion : '',
    tipoLogistica,
    transport,
    montaje,
    desmontaje,
    ubicacion,
    secondaryTime,
    autorizadoCultura: isSalaMode ? currentAuth : 'no',
    autorizadoFecha: isSalaMode ? finalAuthDate : null,
    festivo: isActMode ? isFestivo : 'no',
    dateStart,
    dateEnd: isRange ? dateEnd : null,
    timeStart,
    timeEnd,
    notes,
    synced: false
  };

  if (editingEventId) {
    const idx = events.findIndex(e => e.id === editingEventId);
    events[idx] = { ...events[idx], ...payload };
    syncEvent('update', events[idx]);
    showToast('Evento actualizado', 'success');
  } else {
    const ev = { id: uid(), ...payload, createdAt: new Date().toISOString() };
    events.push(ev);
    syncEvent('add', ev);
    showToast('Evento añadido', 'success');
  }

  saveEvents();
  closeModal('add-modal');
  render();
}

function deleteCurrentEvent() {
  if (!editingEventId) return;
  const ev = events.find(e => e.id === editingEventId);
  if (!confirm(`¿Eliminar este evento del ${formatDisplayDateWithDay(ev.dateStart)}?`)) return;

  pushState();

  syncEvent('delete', ev);
  events = events.filter(e => e.id !== editingEventId);
  saveEvents();
  closeModal('add-modal');
  showToast('Evento eliminado', 'info');
  render();
}

   EXPORTACIÓN PDF MODAL & ZIP COMPLETO

function openExportModal() {
  const dStr = dateStr(new Date());
  document.getElementById('export-date-from').value = dStr;
  document.getElementById('export-date-to').value = dStr;
  openModal('export-modal');
}

function handleExportScopeChange() {
  const sc = document.getElementById('export-scope').value;
  document.getElementById('export-custom-dates').style.display = (sc === 'custom_range') ? 'grid' : 'none';
}

function filterEventsByType(evList, filterType) {
  if (filterType === 'salas') return evList.filter(e => !!e.sala);
  if (filterType === 'actuaciones') return evList.filter(e => !!e.actuacion);
  if (filterType === 'logistica') return evList.filter(e => !e.sala && !e.actuacion && (e.transport === 'si' || e.montaje || e.desmontaje || !!e.tipoLogistica || !!e.ubicacion));
  if (filterType === 'festivos') return evList.filter(e => e.festivo === 'si');
  return evList;
}

function generatePDFDocument(titleHeader, subTitleHeader, listEvents) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(14);
  doc.text(`🎵 ${titleHeader}`, 10, 14);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.text(subTitleHeader, 280, 14, { align: 'right' });

  const tableData = [];

  listEvents.forEach(ev => {
    const dates = formatDisplayRange(ev.dateStart, ev.dateEnd);
    const horario = formatTimeRangeDisplay(ev);
    const salaCol = ev.sala || (ev.actuacion ? `🎺 ${ev.actuacion}` : '—');
    
    let logCol = '—';
    if (!ev.sala && !ev.actuacion) {
      const t = ev.tipoLogistica || (ev.transport === 'si' ? 'transporte' : (ev.montaje ? 'montaje' : (ev.desmontaje ? 'desmontaje' : '')));
      if (t === 'transporte') logCol = '🚚 Transporte';
      else if (t === 'mochila') logCol = '🎒 Mochila';
      else if (t === 'montaje') logCol = '🛒 Montaje';
      else if (t === 'desmontaje') logCol = '🛒 Desmontaje';
      else if (t === 'montar_desmontar') logCol = '🔄 Montar > Desmontar';
      else if (t === 'desmontar_montar') logCol = '🔄 Desmontar > Montar';
      else if (t === 'retranquear') logCol = '↔️ Retranquear';
    }

    const ubiCol = ev.ubicacion || '—';
    const festivoCol = ev.festivo === 'si' ? 'Sí' : 'No';
    const notesCol = ev.notes || '';

    tableData.push([dates, salaCol, logCol, ubiCol, horario, festivoCol, notesCol]);
  });

  if (tableData.length === 0) {
    tableData.push(['—', '—', '—', '—', '—', '—', 'Sin eventos para este período o filtro']);
  }

  doc.autoTable({
    startY: 20,
    head: [['Fecha', 'Sala / Actuación', 'Servicio / Logística', 'Ubicación / Trayecto', 'Horario', 'Festivo', 'Notas']],
    body: tableData,
    theme: 'grid',
    styles: { font: 'helvetica', fontSize: 8, cellPadding: 2.5 },
    headStyles: { fillColor: [230, 235, 245], textColor: [0, 0, 0], fontStyle: 'bold' },
    margin: { left: 8, right: 8 }
  });

  return doc;
}

async function executeExportPDF() {
  const scope = document.getElementById('export-scope').value;
  const filter = document.getElementById('export-filter').value;
  const btn = document.getElementById('btn-do-export');
  
  btn.textContent = 'Generando...';
  btn.disabled = true;

  try {
    const now = new Date();
    const curYear = currentDate.getFullYear();
    const curMonth = currentDate.getMonth();
    const dateFormatted = `${String(now.getDate()).padStart(2,'0')}-${String(now.getMonth()+1).padStart(2,'0')}-${now.getFullYear()}`;

    const zip = new JSZip();

    if (scope === 'all_views') {
      const yearEvents = filterEventsByType(events.filter(e => (e.dateStart && e.dateStart.startsWith(`${curYear}`))), filter);
      const docAnual = generatePDFDocument(`Sala y transporte — Vista Anual ${curYear}`, `Generado: ${dateFormatted}`, yearEvents);
      zip.file(`Sala y transporte (anual) - ${dateFormatted}.pdf`, docAnual.output('blob'));

      const monthPrefix = `${curYear}-${String(curMonth+1).padStart(2,'0')}`;
      const monthEvents = filterEventsByType(events.filter(e => (e.dateStart && e.dateStart.startsWith(monthPrefix))), filter);
      const docMensual = generatePDFDocument(`Sala y transporte — Mes de ${MONTHS_ES[curMonth]} ${curYear}`, `Generado: ${dateFormatted}`, monthEvents);
      zip.file(`Sala y transporte (mensual) - ${dateFormatted}.pdf`, docMensual.output('blob'));

      const allSortedEvents = filterEventsByType([...events].sort((a,b) => (a.dateStart||'').localeCompare(b.dateStart||'')), filter);
      const docAgenda = generatePDFDocument(`Sala y transporte — Agenda Completa`, `Generado: ${dateFormatted}`, allSortedEvents);
      zip.file(`Sala y transporte (agenda) - ${dateFormatted}.pdf`, docAgenda.output('blob'));

    } else if (scope === 'year') {
      const yearEvents = filterEventsByType(events.filter(e => (e.dateStart && e.dateStart.startsWith(`${curYear}`))), filter);
      const doc = generatePDFDocument(`Sala y transporte — Anual ${curYear}`, `Generado: ${dateFormatted}`, yearEvents);
      zip.file(`Sala y transporte (anual) - ${dateFormatted}.pdf`, doc.output('blob'));

    } else if (scope === 'month') {
      const monthPrefix = `${curYear}-${String(curMonth+1).padStart(2,'0')}`;
      const monthEvents = filterEventsByType(events.filter(e => (e.dateStart && e.dateStart.startsWith(monthPrefix))), filter);
      const doc = generatePDFDocument(`Sala y transporte — ${MONTHS_ES[curMonth]} ${curYear}`, `Generado: ${dateFormatted}`, monthEvents);
      zip.file(`Sala y transporte (mensual) - ${dateFormatted}.pdf`, doc.output('blob'));

    } else if (scope === 'day') {
      const ds = dateStr(currentDate);
      const dayEvs = filterEventsByType(eventsOnDate(ds), filter);
      const doc = generatePDFDocument(`Sala y transporte — Día ${formatDisplayDateWithDay(ds)}`, `Generado: ${dateFormatted}`, dayEvs);
      zip.file(`Sala y transporte (dia_${formatDisplayDate(ds)}) - ${dateFormatted}.pdf`, doc.output('blob'));

    } else if (scope === 'custom_range') {
      const from = document.getElementById('export-date-from').value;
      const to = document.getElementById('export-date-to').value;
      const rangeEvents = filterEventsByType(events.filter(e => e.dateStart >= from && e.dateStart <= to), filter);
      const doc = generatePDFDocument(`Sala y transporte — Rango (${formatDisplayDateWithDay(from)} al ${formatDisplayDateWithDay(to)})`, `Generado: ${dateFormatted}`, rangeEvents);
      zip.file(`Sala y transporte (rango_${formatDisplayDate(from)}_a_${formatDisplayDate(to)}) - ${dateFormatted}.pdf`, doc.output('blob'));
    }

    const content = await zip.generateAsync({ type: 'blob' });
    const zipName = `Sala y transporte - ${dateFormatted}.zip`;

    const downloadLink = document.createElement('a');
    downloadLink.href = URL.createObjectURL(content);
    downloadLink.download = zipName;
    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);

    closeModal('export-modal');
    showToast(`Archivo ${zipName} descargado`, 'success');
  } catch (err) {
    console.error(err);
    showToast('Error generando los PDFs', 'error');
  }

  btn.textContent = 'Generar ZIP';
  btn.disabled = false;
}

   /* ═══════════════════════════════════════════════════════
   GOOGLE SHEETS AUTOMATIC BACKGROUND SYNC & POLLING
═══════════════════════════════════════════════════════ */
let isSyncingToServer = 0;
// Conjunto para retener temporalmente los IDs eliminados y evitar el "rebote"
const pendingDeletions = new Set();

function showLoadingOverlay() {
  const overlay = document.getElementById('loading-overlay');
  if (overlay) overlay.classList.add('active');
}

function hideLoadingOverlay() {
  const overlay = document.getElementById('loading-overlay');
  if (overlay) overlay.classList.remove('active');
}

async function syncEvent(action, ev) {
  if (!GOOGLE_SHEETS_URL || !ev) return;
  isSyncingToServer++;

  if (action === 'delete') {
    pendingDeletions.add(ev.id);
  }

  try {
    await fetch(GOOGLE_SHEETS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, event: ev })
    });
    
    const idx = events.findIndex(e => e.id === ev.id);
    if (idx >= 0 && action !== 'delete') {
      events[idx].synced = true;
      saveEvents(false);
    }
  } catch(err) {
    console.warn('Sync error:', err);
  } finally {
    setTimeout(() => {
      isSyncingToServer = Math.max(0, isSyncingToServer - 1);
    }, 1500);

    // Tras 6 segundos, Google Sheets ya procesó el borrado de sobra; liberamos el ID
    if (action === 'delete') {
      setTimeout(() => {
        pendingDeletions.delete(ev.id);
      }, 6000);
    }
  }
}

async function autoSyncSheets(showFeedback = false) {
  if (!GOOGLE_SHEETS_URL || isSyncingToServer > 0) return;
  const syncIcon = document.getElementById('sync-icon-svg');
  if (syncIcon) syncIcon.classList.add('spin-icon');

  try {
    const res = await fetch(`${GOOGLE_SHEETS_URL}?action=getAll`);
    const data = await res.json();
    
    if (data.events && Array.isArray(data.events)) {
      const serverEvents = data.events;
      
      const mergedMap = new Map();

      serverEvents.forEach(se => {
        // Bloquear cualquier evento que esté en la lista de eliminados recientemente
        if (!pendingDeletions.has(se.id)) {
          mergedMap.set(se.id, { ...se, synced: true });
        }
      });

      // Conservar eventos locales que aún no hayan terminado de subir
      events.forEach(localEv => {
        if (!pendingDeletions.has(localEv.id) && !mergedMap.has(localEv.id) && localEv.synced === false) {
          mergedMap.set(localEv.id, localEv);
        }
      });

      const nextEvents = Array.from(mergedMap.values());
      const hasChanged = JSON.stringify(events) !== JSON.stringify(nextEvents);

      events = nextEvents;
      saveEvents(false);

      if (hasChanged) {
        render();
      }
      if (showFeedback) showToast('Base de datos sincronizada', 'success');
    }
  } catch(err) {
    console.warn('AutoSync background notice:', err);
    if (showFeedback) showToast('Error al conectar con la base de datos', 'error');
  } finally {
    if (syncIcon) syncIcon.classList.remove('spin-icon');
  }
}

/* Sincronización manual desde el icono */
async function manualSync() {
  showLoadingOverlay();
  await autoSyncSheets(true);
  hideLoadingOverlay();
}

/* Auto-refresco periódico (cada 12 segundos) para captar cambios de otros dispositivos */
setInterval(() => {
  if (document.visibilityState === 'visible' && isSyncingToServer === 0) {
    autoSyncSheets(false);
  }
}, 12000);

let focusDebounceTimer;
let lastKnownDay = new Date().getDate();

// Re-renderizar si cambia el día automáticamente mientras la aplicación está abierta
setInterval(() => {
  const currentRealDay = new Date().getDate();
  if (currentRealDay !== lastKnownDay) {
    lastKnownDay = currentRealDay;
    render();
  }
}, 60000); // Comprueba cada minuto

window.addEventListener('focus', () => {
  const currentRealDay = new Date().getDate();
  if (currentRealDay !== lastKnownDay) {
    lastKnownDay = currentRealDay;
    render();
  }
  clearTimeout(focusDebounceTimer);
  focusDebounceTimer = setTimeout(() => {
    if (GOOGLE_SHEETS_URL && isSyncingToServer === 0) {
      autoSyncSheets(false);
    }
  }, 1000);
});

/* ═══════════════════════════════════════
   TEMPORIZADOR EN VIVO (SEGUNDO A SEGUNDO)
   Actualiza la cuenta atrás y la línea roja
═══════════════════════════════════════ */
setInterval(() => {
  const cdText = getCountdownText();

  // 1. Actualizar texto en el badge de la vista de Mes
  const monthBadge = document.getElementById('month-live-countdown');
  if (monthBadge) {
    if (cdText) {
      monthBadge.textContent = cdText;
      monthBadge.style.display = '';
    } else {
      monthBadge.style.display = 'none';
    }
  }

  // 2. Actualizar posición de la línea roja y el label en vistas Semana / Día
  const timelineEl = document.getElementById('timeline-indicator');
  if (timelineEl) {
    const now = new Date();
    const curMinutes = (now.getHours() * 60) + now.getMinutes();
    const lineTop = (curMinutes / 60) * 53;
    timelineEl.style.top = `${lineTop}px`;

    let labelEl = timelineEl.querySelector('.timeline-countdown-label');
    if (cdText) {
      if (!labelEl) {
        labelEl = document.createElement('span');
        labelEl.className = 'timeline-countdown-label';
        timelineEl.appendChild(labelEl);
      }
      labelEl.textContent = cdText;
    } else if (labelEl) {
      labelEl.remove();
    }
  }
}, 1000);

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
let toastTimer;
function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

/* ═══════════════════════════════════════
   INIT (CARGA INICIAL FORZADA CON OVERLAY)
═══════════════════════════════════════ */
async function initApp() {
  updateHistoryButtons();
  render();

  if (GOOGLE_SHEETS_URL) {
    showLoadingOverlay();
    await autoSyncSheets(false);
    hideLoadingOverlay();
  }
}

initApp();
</script>
