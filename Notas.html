<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notas - bSMHuelva</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-window: #fbfbfd;
      --bg-sidebar: #f5f5f7;
      --bg-item-active: #e8e8ed;
      --border-color: #e5e5ea;
      --text-main: #1d1d1f;
      --text-muted: #86868b;
      --apple-yellow: #f5a623;
      --apple-orange: #ff9500;
      --apple-red: #ff3b30;
      --apple-green: #34c759;
      --apple-blue: #007aff;
      --apple-purple: #af52de;
      --apple-cyan: #5ac8fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-window);
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .notes-app {
      width: 100vw;
      height: 100vh;
      background: var(--bg-window);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* PANTALLA DE CARGA INICIAL DIFUMINADA */
    .sync-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .sync-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .apple-spinner {
      width: 46px;
      height: 46px;
      border: 3.5px solid #e5e5ea;
      border-top: 3.5px solid var(--apple-blue);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin-bottom: 16px;
    }

    .sync-overlay-text {
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
      letter-spacing: -0.2px;
    }

    /* BARRA SUPERIOR */
    .top-toolbar {
      height: 52px;
      background: #fbfbfd;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      user-select: none;
      z-index: 10;
    }

    .btn-back-nav {
      background-color: #4a5568;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: 7px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    .btn-back-nav:hover { background-color: #374151; }
    .btn-back-nav:active { transform: scale(0.97); }

    /* BOTÓN GUARDAR EXPLÍCITO */
    .btn-save-cloud {
      background-color: var(--apple-blue);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: 7px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    .btn-save-cloud:hover { background-color: #0066d6; }
    .btn-save-cloud:active { transform: scale(0.97); }
    .btn-save-cloud.has-pending {
      background-color: var(--apple-orange);
    }

    .btn-icon {
      background: none;
      border: none;
      color: #48484a;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      position: relative;
    }

    .btn-icon:hover { background: rgba(0,0,0,0.06); }
    .btn-icon:active { background: rgba(0,0,0,0.1); }
    .btn-icon.active-pinned { color: var(--apple-orange); }

    /* ICONO PAPELERA EN ROJO */
    .btn-delete-red {
      color: var(--apple-red) !important;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn-delete-red:hover {
      background: rgba(255, 59, 48, 0.12) !important;
      transform: scale(1.06);
    }
    .btn-delete-red:active {
      transform: scale(0.94);
    }

    /* BOTÓN DE ESTADO / RECARGAR NUBE */
    .sync-status-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 8px;
      cursor: pointer;
      background: none;
      border: none;
      transition: background 0.15s ease;
    }
    .sync-status-container:hover {
      background: rgba(0,0,0,0.05);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--apple-green);
      transition: background-color 0.25s ease, transform 0.2s ease;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.05);
    }

    .status-dot.green {
      background-color: #34c759;
      box-shadow: 0 0 6px rgba(52, 199, 89, 0.6);
    }
    .status-dot.orange {
      background-color: #ff9500;
      box-shadow: 0 0 6px rgba(255, 149, 0, 0.6);
      animation: pulse-dot 0.8s infinite alternate ease-in-out;
    }
    .status-dot.red {
      background-color: #ff3b30;
      box-shadow: 0 0 6px rgba(255, 59, 48, 0.6);
    }

    @keyframes pulse-dot {
      0% { transform: scale(0.85); opacity: 0.7; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .folder-title-display {
      display: flex;
      flex-direction: column;
      min-width: 110px;
      margin-left: 4px;
    }

    .folder-title-display h4 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }
    .folder-title-display span {
      font-size: 11px;
      color: var(--text-muted);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 10px;
    }

    .search-box {
      margin-left: auto;
      position: relative;
      width: 220px;
      display: flex;
      align-items: center;
    }

    .search-box input {
      width: 100%;
      background: #e3e3e8;
      border: none;
      border-radius: 8px;
      padding: 6px 12px 6px 30px;
      font-size: 13px;
      outline: none;
      height: 30px;
    }

    .search-box svg {
      position: absolute;
      left: 8px;
      width: 15px;
      height: 15px;
      color: #8e8e93;
      pointer-events: none;
    }

    /* POPOVER ESTILO APPLE NOTES */
    .format-popover-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      height: 32px;
    }

    .btn-format-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 1px;
      width: 32px;
      height: 32px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      user-select: none;
      border-radius: 6px;
      padding: 0;
      line-height: 1;
    }

    .btn-format-trigger .ios-big-a {
      font-size: 16px;
      font-weight: 700;
      color: #48484a;
      line-height: 1;
      display: inline-block;
    }

    .btn-format-trigger .ios-small-a {
      font-size: 12px;
      font-weight: 600;
      color: #48484a;
      line-height: 1;
      display: inline-block;
      transform: translateY(1.5px);
    }

    .btn-format-trigger:hover .ios-big-a,
    .btn-format-trigger:hover .ios-small-a {
      color: var(--apple-orange);
    }

    .apple-format-menu {
      position: absolute;
      top: 42px;
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 20px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18), 0 4px 12px rgba(0, 0, 0, 0.06);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
      width: 380px;
      max-width: 90vw;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1), transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apple-format-menu.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
    }

    /* Píldoras de Tipo de Texto distribuidas uniformemente */
    .format-type-pill-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3px;
      width: 100%;
    }

    .pill-btn {
      flex: 1;
      text-align: center;
      border: none;
      background: transparent;
      padding: 6px 8px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 500;
      color: #1d1d1f;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .pill-btn:hover { background: rgba(0, 0, 0, 0.05); }
    .pill-btn.active {
      background: #e59e00;
      color: #ffffff;
      font-weight: 600;
    }

    /* Filas de botones agrupados con fondo gris translúcido */
    .format-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .format-segment-group {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
      padding: 2px;
      flex: 1;
      justify-content: space-around;
    }

    .seg-btn {
      border: none;
      background: transparent;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 14px;
      color: #1d1d1f;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      transition: background 0.12s ease;
    }

    .seg-btn:hover {
      background: rgba(255, 255, 255, 0.65);
    }
    .seg-btn:active {
      background: rgba(255, 255, 255, 0.9);
    }

    .color-swatch-circle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .color-swatch-circle:hover {
      transform: scale(1.15);
    }

    /* --- ESTILOS DE ELEMENTOS IOS --- */
    .apple-checklist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 3px 0;
      min-height: 24px;
      line-height: 1.5;
    }
    .apple-checklist-text {
      flex: 1;
      outline: none;
      min-width: 20px;
    }
    .apple-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #8e8e93;
      border-radius: 50%;
      outline: none;
      cursor: pointer;
      margin-top: 3px;
      position: relative;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .apple-checkbox:checked {
      background-color: var(--apple-orange);
      border-color: var(--apple-orange);
    }
    .apple-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 2px;
      width: 4px;
      height: 8px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .apple-checkbox:checked + span, 
    .apple-checkbox:checked + div {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .apple-notes-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
    }
    .apple-notes-table td, .apple-notes-table th {
      border: 1px solid #d1d1d6;
      padding: 8px 12px;
      min-width: 60px;
      font-size: 14px;
    }
    .apple-notes-table th {
      background-color: #f2f2f7;
      font-weight: 600;
    }

    /* MODAL DE DIBUJO ESTILO APPLE PENCIL */
    .apple-drawing-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .apple-drawing-modal.hidden {
      display: none;
    }
    .drawing-window {
      background: #ffffff;
      border-radius: 18px;
      width: 90%;
      max-width: 780px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .drawing-toolbar {
      padding: 10px 16px;
      background: #fbfbfd;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #drawing-canvas {
      background: #ffffff;
      touch-action: none;
      cursor: crosshair;
    }

    .main-workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .sidebar-folders {
      width: 220px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: width 0.25s ease, opacity 0.2s ease;
    }

    .sidebar-folders.collapsed {
      width: 0;
      opacity: 0;
      pointer-events: none;
    }

    .folder-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
      list-style: none;
    }

    .folder-item {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border-radius: 7px;
      color: var(--text-main);
      font-size: 13px;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      margin-bottom: 2px;
      transition: background 0.15s ease, outline 0.15s ease;
    }

    .folder-item:hover { background: rgba(0,0,0,0.04); }
    .folder-item.active {
      background: #e1e1e6;
      font-weight: 600;
    }

    .folder-item.drag-target {
      background: rgba(0, 122, 255, 0.15) !important;
      outline: 2px dashed var(--apple-blue);
    }

    .folder-item span.count {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
    }

    .new-folder-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      color: var(--apple-orange);
      font-size: 13px;
      font-weight: 500;
      border-top: 1px solid var(--border-color);
      cursor: pointer;
      background: none;
      border: none;
      width: 100%;
      text-align: left;
    }

    .notes-list-pane {
      width: 290px;
      background: #fbfbfd;
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .group-section {
      display: flex;
      flex-direction: column;
    }

    .group-header {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 10px 14px 4px 14px;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .group-header:hover { color: var(--text-main); }

    .group-header-left {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .group-arrow {
      transition: transform 0.2s ease;
      display: inline-flex;
    }

    .group-section.collapsed .group-arrow {
      transform: rotate(-90deg);
    }

    .group-cards-container {
      display: flex;
      flex-direction: column;
    }

    .group-section.collapsed .group-cards-container {
      display: none;
    }

    .note-card {
      margin: 2px 10px 4px 10px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: grab;
      position: relative;
      transition: background 0.1s ease, opacity 0.15s ease;
      user-select: none;
    }

    .note-card:active { cursor: grabbing; }
    .note-card.dragging { opacity: 0.4; }
    .note-card:hover { background: #f2f2f7; }
    .note-card.active { background: #e8e8ed; }

    .note-card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 2px;
    }

    .note-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .btn-pin-card {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      display: flex;
      align-items: center;
      opacity: 0.4;
      transition: opacity 0.15s, color 0.15s, transform 0.1s;
    }

    .btn-pin-card:hover {
      opacity: 1;
      transform: scale(1.1);
      color: var(--apple-orange);
    }

    .btn-pin-card.is-pinned {
      opacity: 1;
      color: var(--apple-orange);
    }

    .note-card-meta {
      display: flex;
      font-size: 12px;
      gap: 6px;
      color: var(--text-muted);
    }

    .note-card-date {
      color: var(--text-main);
      font-weight: 500;
      flex-shrink: 0;
    }

    .note-card-preview {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      padding: 24px 40px;
      overflow-y: auto;
    }

    .editor-header-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #f0f0f2;
      padding-bottom: 8px;
    }

    .editor-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .note-content {
      font-size: 16px;
      line-height: 1.6;
      color: #1d1d1f;
      outline: none;
      min-height: 100%;
    }

    .note-content h1 { 
      font-size: 26px; 
      font-weight: 700; 
      margin-bottom: 8px; 
      line-height: 1.2;
    }
    .note-content h1:empty:before {
      content: "Título";
      color: #c7c7cc;
      pointer-events: none;
      font-weight: 700;
    }
    .note-content p { 
      font-size: 16px; 
      font-weight: normal; 
      margin-bottom: 12px; 
    }
    .note-content:empty:before {
      content: "Escribe aquí...";
      color: var(--text-muted);
      pointer-events: none;
      display: block;
    }

    .hl-cyan   { background-color: #a5f3fc; border-radius: 4px; padding: 0 4px; }
    .hl-pink   { background-color: #fbcfe8; border-radius: 4px; padding: 0 4px; }
    .hl-orange { background-color: #fed7aa; border-radius: 4px; padding: 0 4px; }
    .hl-green  { background-color: #bbf7d0; border-radius: 4px; padding: 0 4px; }
    .hl-yellow { background-color: #fef08a; border-radius: 4px; padding: 0 4px; }
  </style>
</head>
<body>

<div id="sync-overlay" class="sync-overlay">
  <div class="apple-spinner"></div>
  <div class="sync-overlay-text">Sincronizando notas...</div>
</div>

<div class="notes-app">
  <div class="top-toolbar">
    <button onclick="window.history.back()" class="btn-back-nav" title="Volver atrás">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m12 8-4 4 4 4"/><path d="M16 12H8"/></svg>
      <span>Volver</span>
    </button>

    <button class="btn-icon" id="toggle-sidebar" title="Alternar Barra Lateral">
      <i data-lucide="panel-left"></i>
    </button>

    <div class="folder-title-display">
      <h4 id="current-folder-title">Todas las notas</h4>
      <span id="note-count-display">0 notas</span>
    </div>

    <div class="toolbar-actions">
      <!-- DESHACER / REHACER -->
      <button class="btn-icon" onclick="execUndo()" title="Deshacer (Ctrl+Z)">
        <i data-lucide="undo-2"></i>
      </button>
      <button class="btn-icon" onclick="execRedo()" title="Rehacer (Ctrl+Y)">
        <i data-lucide="redo-2"></i>
      </button>

      <!-- BOTÓN GUARDAR EXPLÍCITO -->
      <button class="btn-save-cloud" id="btn-save-cloud" onclick="manualSave()" title="Guardar cambios en Google Sheets">
        <i data-lucide="save" style="width:16px; height:16px;"></i>
        <span id="save-btn-text">Guardar</span>
      </button>

      <button class="btn-icon" id="btn-new-note" title="Nueva Nota">
        <i data-lucide="square-pen" style="color: var(--apple-orange)"></i>
      </button>

      <!-- BOTÓN PAPELERA EN ROJO -->
      <button class="btn-icon btn-delete-red" id="btn-delete-note" title="Eliminar Nota">
        <i data-lucide="trash-2"></i>
      </button>

      <!-- BOTÓN Y CAJA FLOTANTE DE HERRAMIENTAS APPLE (Aa) -->
      <div class="format-popover-container">
        <button class="btn-icon btn-format-trigger" id="btn-format-menu" title="Formato de texto" onclick="toggleFormatMenu(event)">
          Aa
        </button>

        <div class="apple-format-menu" id="apple-format-menu">
          <!-- 1. Píldoras de Jerarquía de Texto -->
          <div class="format-type-pill-group">
            <button class="pill-btn" onclick="applyBlockFormat('h1')">Título</button>
            <button class="pill-btn" onclick="applyBlockFormat('h2')">Encabezamiento</button>
            <button class="pill-btn" onclick="applyBlockFormat('h3')">Subtítulo</button>
            <button class="pill-btn active" onclick="applyBlockFormat('p')">Cuerpo</button>
          </div>

          <!-- 2. Formato de Carácter y Resaltador -->
          <div class="format-row">
            <div class="format-segment-group">
              <button class="seg-btn" onclick="formatDoc('bold')" title="Negrita"><b>B</b></button>
              <button class="seg-btn" onclick="formatDoc('italic')" title="Cursiva"><i>I</i></button>
              <button class="seg-btn" onclick="formatDoc('underline')" title="Subrayado"><u>U</u></button>
              <button class="seg-btn" onclick="formatDoc('strikeThrough')" title="Tachado"><s>S</s></button>
            </div>

            <!-- Paleta de color estilo pluma / bolita -->
            <div class="format-segment-group" style="flex: 0 0 auto; gap: 4px; padding: 2px 6px;">
              <span class="color-swatch-circle" style="background:#ff2d55;" onclick="applyHighlight('hl-pink')" title="Rosa"></span>
              <span class="color-swatch-circle" style="background:#ffd60a;" onclick="applyHighlight('hl-yellow')" title="Amarillo"></span>
              <span class="color-swatch-circle" style="background:#34c759;" onclick="applyHighlight('hl-green')" title="Verde"></span>
              <span class="color-swatch-circle" style="background:#5ac8fa;" onclick="applyHighlight('hl-cyan')" title="Cian"></span>
              <span class="color-swatch-circle" style="background:#ff9500;" onclick="applyHighlight('hl-orange')" title="Naranja"></span>
            </div>
          </div>

          <!-- 3. Listas y Sangrías -->
          <div class="format-row">
            <div class="format-segment-group">
              <button class="seg-btn" onclick="formatDoc('insertUnorderedList')" title="Lista con viñetas">
                <i data-lucide="list" style="width:15px; height:15px;"></i>
              </button>
              <button class="seg-btn" onclick="formatDoc('insertOrderedList')" title="Lista numerada">
                <i data-lucide="list-ordered" style="width:15px; height:15px;"></i>
              </button>
            </div>

            <div class="format-segment-group">
              <button class="seg-btn" onclick="formatDoc('outdent')" title="Disminuir sangría">
                <i data-lucide="outdent" style="width:15px; height:15px;"></i>
              </button>
              <button class="seg-btn" onclick="formatDoc('indent')" title="Aumentar sangría">
                <i data-lucide="indent" style="width:15px; height:15px;"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- BOTONES ESTILO IOS (Checklist, Tabla, Dibujo, Compartir) -->
      <button class="btn-icon" onclick="insertChecklist()" title="Lista de comprobación">
        <i data-lucide="list-checks"></i>
      </button>
      <button class="btn-icon" onclick="insertTable()" title="Insertar tabla">
        <i data-lucide="table"></i>
      </button>
      <button class="btn-icon" onclick="openDrawingModal()" title="Dibujar">
        <i data-lucide="pen-tool"></i>
      </button>
      <button class="btn-icon" onclick="exportNoteToPDF()" title="Imprimir">
        <i data-lucide="printer"></i>
      </button>

      <!-- BOTÓN DESCARGAR / RECARGAR NUBE -->
      <button class="sync-status-container" id="btn-sync" onclick="fetchChangesFromCloud(true)" title="Recargar desde la nube">
        <span class="status-dot green" id="sync-dot"></span>
        <i data-lucide="refresh-cw" style="width:16px; height:16px; color: #6b7280;"></i>
      </button>
    </div>

    <div class="search-box">
      <i data-lucide="search"></i>
      <input type="text" id="search-input" placeholder="Buscar">
    </div>
  </div>

  <div class="main-workspace">
    <div class="sidebar-folders" id="sidebar-folders">
      <ul class="folder-list" id="folder-list"></ul>
      <button class="new-folder-btn" onclick="createNewFolder()">
        <i data-lucide="folder-plus" style="width:16px;"></i> Nueva Carpeta
      </button>
    </div>

    <div class="notes-list-pane" id="notes-list-pane"></div>

    <div class="editor-pane">
      <div class="editor-header-bar">
        <div class="editor-date" id="editor-date-label">Selecciona una nota</div>
      </div>
      <div class="note-content" id="editor" contenteditable="true" spellcheck="false"></div>
    </div>
  </div>
</div>

<!-- MODAL DE DIBUJO ESTILO APPLE PENCIL -->
<div id="drawing-modal" class="apple-drawing-modal hidden">
  <div class="drawing-window">
    <div class="drawing-toolbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <input type="color" id="draw-color" value="#1d1d1f" style="border:none; width:28px; height:28px; border-radius:50%; cursor:pointer;">
        <input type="range" id="draw-width" min="1" max="15" value="3" title="Grosor">
        <button class="btn-icon" onclick="clearDrawingCanvas()" title="Borrar lienzo"><i data-lucide="eraser"></i></button>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-back-nav" onclick="closeDrawingModal()">Cancelar</button>
        <button class="btn-save-cloud" onclick="saveDrawingToNote()">Insertar</button>
      </div>
    </div>
    <canvas id="drawing-canvas" width="780" height="420"></canvas>
  </div>
</div>

<script>
  const SYNC_API_URL = 'https://script.google.com/macros/s/AKfycbyiGklO6RqOffvlI8pCWD6qRJaWzZYLaycWm61eHO8SnszEQstgo-awHG4FAYg2A6klWQ/exec';

  let folders = JSON.parse(localStorage.getItem('apple_notes_folders')) || [
    { id: 'all', name: 'Todas las notas', icon: 'folder' },
    { id: 'projects', name: 'Proyectos', icon: 'folder' },
    { id: 'notes', name: 'Notas', icon: 'folder' }
  ];

  let notes = JSON.parse(localStorage.getItem('apple_notes_data')) || [];

  let currentFolderId = 'all';
  let activeNoteId = notes.length > 0 ? notes[0].id : null;
  let draggedNoteId = null;
  let isSending = false;
  let hasLocalChanges = false;
  let collapsedSections = JSON.parse(localStorage.getItem('apple_notes_collapsed')) || {};

  function setSyncStatus(status, customMsg = '') {
    const dot = document.getElementById('sync-dot');
    const container = document.getElementById('btn-sync');
    if (!dot || !container) return;

    dot.className = 'status-dot ' + status;
    if (status === 'green') {
      const now = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      container.title = customMsg || `Sincronizado (${now}) - Clic para recargar`;
    } else if (status === 'orange') {
      container.title = customMsg || 'Procesando con la nube...';
    } else if (status === 'red') {
      container.title = customMsg || 'Error de conexión';
    }
  }

  function markPendingChanges() {
    hasLocalChanges = true;
    const saveBtn = document.getElementById('btn-save-cloud');
    const saveBtnText = document.getElementById('save-btn-text');
    if (saveBtn) {
      saveBtn.classList.add('has-pending');
      saveBtnText.innerText = 'Guardar *';
    }
    setSyncStatus('orange', 'Tienes cambios pendientes de guardar');
    saveLocal();
  }

  function markSavedChanges() {
    hasLocalChanges = false;
    const saveBtn = document.getElementById('btn-save-cloud');
    const saveBtnText = document.getElementById('save-btn-text');
    if (saveBtn) {
      saveBtn.classList.remove('has-pending');
      saveBtnText.innerText = 'Guardar';
    }
    setSyncStatus('green');
  }

  function hideOverlay() {
    const overlay = document.getElementById('sync-overlay');
    if (overlay && !overlay.classList.contains('hidden')) {
      overlay.classList.add('hidden');
    }
  }

  function saveLocal() {
    localStorage.setItem('apple_notes_data', JSON.stringify(notes));
    localStorage.setItem('apple_notes_folders', JSON.stringify(folders));
  }

  function renderFolders() {
    const list = document.getElementById('folder-list');
    list.innerHTML = '';

    folders.forEach(f => {
      const count = f.id === 'all' ? notes.length : notes.filter(n => n.folderId === f.id).length;
      const li = document.createElement('li');
      li.className = `folder-item ${f.id === currentFolderId ? 'active' : ''}`;
      li.dataset.folderId = f.id;
      li.innerHTML = `
        <i data-lucide="${f.icon || 'folder'}" style="width:16px;"></i>
        <span>${f.name}</span>
        <span class="count">${count}</span>
      `;

      li.onclick = () => {
        currentFolderId = f.id;
        document.getElementById('current-folder-title').innerText = f.name;
        renderFolders();
        renderNotesList();
      };

      li.ondblclick = () => {
        if (f.id === 'all') return;
        const nuevoNombre = prompt('Cambiar nombre de la carpeta:', f.name);
        if (nuevoNombre && nuevoNombre.trim() !== '') {
          f.name = nuevoNombre.trim();
          markPendingChanges();
          renderFolders();
          if (currentFolderId === f.id) {
            document.getElementById('current-folder-title').innerText = f.name;
          }
        }
      };

      li.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (f.id !== 'all') li.classList.add('drag-target');
      });

      li.addEventListener('dragleave', () => {
        li.classList.remove('drag-target');
      });

      li.addEventListener('drop', (e) => {
        e.preventDefault();
        li.classList.remove('drag-target');
        if (draggedNoteId && f.id !== 'all') {
          const note = notes.find(n => n.id === draggedNoteId);
          if (note) {
            note.folderId = f.id;
            note.updatedAt = new Date().toISOString();
            markPendingChanges();
            renderFolders();
            renderNotesList();
          }
        }
      });

      list.appendChild(li);
    });
    lucide.createIcons();
  }

  function getNoteCategory(noteDate, isPinned) {
    if (isPinned) return 'Fijadas';
    const now = new Date();
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    
    if (noteDate >= startOfToday) return 'Hoy';

    const thirtyDaysAgo = new Date();
    thirtyDaysAgo.setDate(now.getDate() - 30);
    if (noteDate >= thirtyDaysAgo) return 'Últimos 30 días';

    const monthName = noteDate.toLocaleString('es-ES', { month: 'long', year: 'numeric' });
    return monthName.charAt(0).toUpperCase() + monthName.slice(1);
  }

  function toggleSection(groupId) {
    collapsedSections[groupId] = !collapsedSections[groupId];
    localStorage.setItem('apple_notes_collapsed', JSON.stringify(collapsedSections));
    renderNotesList();
  }

  function togglePinNote(id, event) {
    if (event) event.stopPropagation();
    const note = notes.find(n => n.id === id);
    if (note) {
      note.pinned = !note.pinned;
      note.updatedAt = new Date().toISOString();
      markPendingChanges();
      renderNotesList();
      updatePinButtonState();
    }
  }

  function togglePinCurrentNote() {
    if (activeNoteId) togglePinNote(activeNoteId);
  }

  function updatePinButtonState() {
    const pinBtn = document.getElementById('btn-pin-note');
    if (!pinBtn) return;
    const activeNote = notes.find(n => n.id === activeNoteId);
    if (activeNote && activeNote.pinned) {
      pinBtn.classList.add('active-pinned');
    } else {
      pinBtn.classList.remove('active-pinned');
    }
  }

  function renderNotesList() {
    const container = document.getElementById('notes-list-pane');
    const query = document.getElementById('search-input').value.toLowerCase();
    container.innerHTML = '';

    let filtered = notes.filter(n => {
      const matchesFolder = currentFolderId === 'all' || n.folderId === currentFolderId;
      const matchesSearch = (n.title || '').toLowerCase().includes(query) || (n.body || '').toLowerCase().includes(query);
      return matchesFolder && matchesSearch;
    });

    filtered.sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));
    document.getElementById('note-count-display').innerText = `${filtered.length} notas`;

    const groups = {};
    const groupOrder = [];

    filtered.forEach(note => {
      const dateObj = new Date(note.updatedAt || note.createdAt || Date.now());
      const groupName = getNoteCategory(dateObj, !!note.pinned);

      if (!groups[groupName]) {
        groups[groupName] = [];
        groupOrder.push(groupName);
      }
      groups[groupName].push(note);
    });

    if (groupOrder.includes('Fijadas')) {
      groupOrder.splice(groupOrder.indexOf('Fijadas'), 1);
      groupOrder.unshift('Fijadas');
    }

    groupOrder.forEach(groupName => {
      const groupSection = document.createElement('div');
      groupSection.className = `group-section ${collapsedSections[groupName] ? 'collapsed' : ''}`;

      const groupHeader = document.createElement('div');
      groupHeader.className = 'group-header';
      groupHeader.onclick = () => toggleSection(groupName);

      groupHeader.innerHTML = `
        <div class="group-header-left">
          <span class="group-arrow"><i data-lucide="chevron-down" style="width:14px; height:14px;"></i></span>
          <span>${groupName}</span>
        </div>
        <span style="font-size:10px; opacity:0.7;">${groups[groupName].length}</span>
      `;

      const cardsContainer = document.createElement('div');
      cardsContainer.className = 'group-cards-container';

      groups[groupName].forEach(note => {
        const dateObj = new Date(note.updatedAt || note.createdAt || Date.now());
        const card = document.createElement('div');
        card.className = `note-card ${note.id === activeNoteId ? 'active' : ''}`;
        card.draggable = true;

        card.addEventListener('dragstart', () => {
          draggedNoteId = note.id;
          card.classList.add('dragging');
        });

        card.addEventListener('dragend', () => {
          draggedNoteId = null;
          card.classList.remove('dragging');
        });

        const { title, preview } = extractNoteLines(note.body);
        const cardTitle = note.title || title;

        card.innerHTML = `
          <div class="note-card-title-row">
            <div class="note-card-title">${cardTitle}</div>
            <button class="btn-pin-card ${note.pinned ? 'is-pinned' : ''}" title="${note.pinned ? 'Desfijar' : 'Fijar'}" onclick="togglePinNote('${note.id}', event)">
              <i data-lucide="pin" style="width: 13px; height: 13px; transform: ${note.pinned ? 'rotate(45deg)' : 'none'};"></i>
            </button>
          </div>
          <div class="note-card-meta">
            <span class="note-card-date">${formatCardDate(dateObj)}</span>
            <span class="note-card-preview">${preview}</span>
          </div>
        `;

        card.onclick = () => selectNote(note.id);
        cardsContainer.appendChild(card);
      });

      groupSection.appendChild(groupHeader);
      groupSection.appendChild(cardsContainer);
      container.appendChild(groupSection);
    });

    updatePinButtonState();
    lucide.createIcons();
  }

  function formatCardDate(date) {
    const now = new Date();
    if (date.toDateString() === now.toDateString()) {
      return date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    }
    return date.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: '2-digit' });
  }

  function selectNote(id) {
    activeNoteId = id;
    const note = notes.find(n => n.id === id);
    const editor = document.getElementById('editor');
    
    if (note) {
      editor.innerHTML = note.body && note.body.trim() !== '' ? note.body : '<h1><br></h1>';
      const dateFormatted = new Date(note.updatedAt || note.createdAt).toLocaleString('es-ES', {
        day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
      document.getElementById('editor-date-label').innerText = `Creada / Modificada: ${dateFormatted}`;
    } else {
      editor.innerHTML = '';
      document.getElementById('editor-date-label').innerText = '';
    }
    renderNotesList();
    updatePinButtonState();
  }

  function extractNoteLines(html) {
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = html || '';
    
    tempDiv.querySelectorAll('h1, h2, h3, p, div, li, br, table, tr').forEach(el => {
      if (el.tagName.toLowerCase() === 'br') {
        el.replaceWith('\n');
      } else {
        el.after('\n');
      }
    });

    const lines = (tempDiv.textContent || '')
      .split('\n')
      .map(l => l.trim())
      .filter(Boolean);

    return {
      title: lines.length > 0 ? lines[0] : 'Nota vacía',
      preview: lines.length > 1 ? lines.slice(1).join(' ') : 'Sin texto adicional'
    };
  }

  function updateActiveNoteFromEditor() {
    const activeNote = notes.find(n => n.id === activeNoteId);
    if (!activeNote) return;

    activeNote.body = document.getElementById('editor').innerHTML;
    const { title } = extractNoteLines(activeNote.body);
    activeNote.title = title;
    activeNote.updatedAt = new Date().toISOString();

    markPendingChanges();
    renderNotesList();
  }

  document.getElementById('editor').addEventListener('input', updateActiveNoteFromEditor);
  document.getElementById('editor').addEventListener('keyup', updateActiveNoteFromEditor);

  document.getElementById('btn-new-note').addEventListener('click', () => {
    const now = new Date().toISOString();
    const newNote = {
      id: 'n_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
      folderId: currentFolderId === 'all' ? 'notes' : currentFolderId,
      title: 'Nota vacía',
      body: '<h1><br></h1>',
      createdAt: now,
      updatedAt: now,
      pinned: false
    };
    notes.unshift(newNote);
    activeNoteId = newNote.id;
    markPendingChanges();
    renderNotesList();
    renderFolders();
    selectNote(newNote.id);
    
    const editor = document.getElementById('editor');
    editor.focus();
    const range = document.createRange();
    const sel = window.getSelection();
    if (editor.firstChild) {
      range.selectNodeContents(editor.firstChild);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  });

  // --- ELIMINAR DIRECTAMENTE Y SINCRONIZAR DE INMEDIATO ---
  document.getElementById('btn-delete-note').addEventListener('click', () => {
    if (!activeNoteId) return;
    
    // 1. Quitar la nota de la lista local
    notes = notes.filter(n => n.id !== activeNoteId);
    activeNoteId = notes.length > 0 ? notes[0].id : null;
    
    saveLocal();
    renderNotesList();
    renderFolders();
    
    if (activeNoteId) selectNote(activeNoteId);
    else {
      document.getElementById('editor').innerHTML = '';
      document.getElementById('editor-date-label').innerText = '';
    }

    // 2. Enviar inmediatamente a Google Sheets sin pulsar guardar
    sendPayloadDirectly();
  });

  function createNewFolder() {
    const folderName = prompt('Nombre de la nueva carpeta:');
    if (!folderName) return;
    folders.push({
      id: 'f_' + Date.now(),
      name: folderName,
      icon: 'folder'
    });
    markPendingChanges();
    renderFolders();
  }

  function formatDoc(cmd, value = null) {
    document.execCommand(cmd, false, value);
    markPendingChanges();
  }

  function applyHighlight(className) {
    const selection = window.getSelection();
    if (!selection.rangeCount) return;
    const range = selection.getRangeAt(0);
    const span = document.createElement('span');
    span.className = className;
    span.appendChild(range.extractContents());
    range.insertNode(span);
    document.getElementById('editor').dispatchEvent(new Event('input'));
    markPendingChanges();
  }

  document.getElementById('toggle-sidebar').addEventListener('click', () => {
    document.getElementById('sidebar-folders').classList.toggle('collapsed');
  });

  document.getElementById('search-input').addEventListener('input', renderNotesList);

  // --- ENVÍO RÁPIDO Y DIRECTO A LA NUBE ---
  function sendPayloadDirectly() {
    const payload = JSON.stringify({ notes, folders });
    markSavedChanges();

    fetch(SYNC_API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: payload
    }).catch(e => {
      console.warn('Error en el envío directo:', e);
      setSyncStatus('red', 'Error al sincronizar con Google Sheets');
    });
  }

  // --- BOTÓN MANUAL GUARDAR (RESPUESTA INSTANTÁNEA) ---
  function manualSave() {
    const saveBtnText = document.getElementById('save-btn-text');
    
    // Feedback visual instantáneo
    if (saveBtnText) saveBtnText.innerText = '¡Guardado!';
    markSavedChanges();

    sendPayloadDirectly();

    setTimeout(() => {
      if (!hasLocalChanges && saveBtnText) saveBtnText.innerText = 'Guardar';
    }, 1200);
  }

  let isFetching = false;
  let isEditorFocused = false;

  // Detectar foco para no pisar el cursor mientras se escribe
  const editorEl = document.getElementById('editor');
  editorEl.addEventListener('focus', () => { isEditorFocused = true; });
  editorEl.addEventListener('blur', () => { isEditorFocused = false; });

  // --- DESCARGAR / SINCRONIZAR DESDE GOOGLE SHEETS ---
  async function fetchChangesFromCloud(isManual = false) {
    // Si hay cambios locales sin guardar y es manual, confirmar; si es auto, cancelar
    if (hasLocalChanges) {
      if (isManual) {
        const confirmReload = confirm('Tienes cambios locales sin guardar. Si recargas se perderán. ¿Deseas recargar de todas formas?');
        if (!confirmReload) return;
      } else {
        return;
      }
    }

    if (!isManual && (isEditorFocused || isFetching)) {
      return;
    }

    isFetching = true;
    if (isManual) setSyncStatus('orange', 'Descargando datos...');

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 6000);

    try {
      const response = await fetch(`${SYNC_API_URL}?t=${Date.now()}`, {
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      const data = await response.json();
      if (data && data.status === "success") {
        const newNotes = Array.isArray(data.notes) ? data.notes : [];
        const newFolders = Array.isArray(data.folders) && data.folders.length > 0 ? data.folders : folders;

        const hasDataChanged = JSON.stringify(newNotes) !== JSON.stringify(notes) ||
                               JSON.stringify(newFolders) !== JSON.stringify(folders);

        if (hasDataChanged) {
          notes = newNotes;
          folders = newFolders;
          saveLocal();
          markSavedChanges();

          if (!notes.find(n => n.id === activeNoteId)) {
            activeNoteId = notes.length > 0 ? notes[0].id : null;
          }

          renderFolders();
          renderNotesList();

          if (activeNoteId) {
            const cur = notes.find(n => n.id === activeNoteId);
            if (!isEditorFocused && cur) {
              selectNote(activeNoteId);
            }
          } else {
            editorEl.innerHTML = '';
            document.getElementById('editor-date-label').innerText = '';
          }
        }
        setSyncStatus('green');
      }
    } catch (err) {
      if (isManual) {
        console.warn('Error al descargar:', err);
        setSyncStatus('red', 'No se pudo descargar de la nube');
      }
    } finally {
      isFetching = false;
      hideOverlay();
    }
  }

  // --- INTERVALO DE SINCRONIZACIÓN AUTOMÁTICA CADA 5 SEGUNDOS ---
  setInterval(() => {
    if (!hasLocalChanges && !isEditorFocused) {
      fetchChangesFromCloud(false);
    }
  }, 5000);

  // Alternar el menú desplegable de formato
  function toggleFormatMenu(event) {
    if (event) event.stopPropagation();
    const menu = document.getElementById('apple-format-menu');
    menu.classList.toggle('show');
  }

  // Cerrar el menú si se hace clic fuera
  document.addEventListener('click', (e) => {
    const menu = document.getElementById('apple-format-menu');
    const btn = document.getElementById('btn-format-menu');
    if (menu && !menu.contains(e.target) && e.target !== btn) {
      menu.classList.remove('show');
    }
  });

  // Aplicar formato de bloque (Título, Encabezamiento, Subtítulo, Cuerpo)
  function applyBlockFormat(tag) {
    document.execCommand('formatBlock', false, `<${tag}>`);
    
    const pills = document.querySelectorAll('.format-type-pill-group .pill-btn');
    pills.forEach(p => p.classList.remove('active'));
    if (event && event.target) {
      event.target.classList.add('active');
    }
    
    markPendingChanges();
  }

  /* ==========================================================================
     NUEVAS FUNCIONES: DESHACER, REHACER Y BOTONES ESTILO IOS
     ========================================================================== */

  // 1. Deshacer y Rehacer (Botones e integración por atajos de teclado)
  function execUndo() {
    document.execCommand('undo', false, null);
    updateActiveNoteFromEditor();
  }

  function execRedo() {
    document.execCommand('redo', false, null);
    updateActiveNoteFromEditor();
  }

  document.addEventListener('keydown', (e) => {
    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
    const modifier = isMac ? e.metaKey : e.ctrlKey;

    if (modifier && e.key.toLowerCase() === 'z') {
      if (e.shiftKey) {
        e.preventDefault();
        execRedo();
      } else {
        e.preventDefault();
        execUndo();
      }
    } else if (modifier && e.key.toLowerCase() === 'y') {
      e.preventDefault();
      execRedo();
    }
  });

  // 2. Checklist interactivo con inserción precisa en la posición del cursor
  function insertChecklist() {
    const editor = document.getElementById('editor');
    editor.focus();

    const sel = window.getSelection();
    let range = null;

    if (sel && sel.rangeCount > 0) {
      range = sel.getRangeAt(0);
    } else {
      range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    }

    const checkItem = document.createElement('div');
    checkItem.className = 'apple-checklist-item';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.className = 'apple-checkbox';
    checkbox.setAttribute('contenteditable', 'false');
    checkbox.onchange = markPendingChanges;

    const spanText = document.createElement('span');
    spanText.className = 'apple-checklist-text';
    spanText.innerHTML = '<br>'; // Espaciador para permitir cursor inmediato

    checkItem.appendChild(checkbox);
    checkItem.appendChild(spanText);

    // Reemplazar párrafo actual si está completamente vacío, o insertar en el punto exacto
    let parentBlock = range.commonAncestorContainer;
    if (parentBlock.nodeType === 3) parentBlock = parentBlock.parentNode;

    if (parentBlock && parentBlock !== editor && parentBlock.parentNode === editor && parentBlock.textContent.trim() === '' && !parentBlock.classList.contains('apple-checklist-item')) {
      editor.replaceChild(checkItem, parentBlock);
    } else {
      range.deleteContents();
      range.insertNode(checkItem);
    }

    // Colocar el cursor de forma exacta dentro del checklist
    const newRange = document.createRange();
    newRange.setStart(spanText, 0);
    newRange.collapse(true);
    sel.removeAllRanges();
    sel.addRange(newRange);

    markPendingChanges();
  }

  // Manejo de eventos de teclado en el editor (Listas y Navegación con Tab en Tablas)
  document.getElementById('editor').addEventListener('keydown', (e) => {
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;

    let node = sel.anchorNode;
    if (!node) return;
    if (node.nodeType === 3) node = node.parentNode;

    // --- 1. NAVEGACIÓN CON TABULADOR (TAB / SHIFT+TAB) EN TABLAS ---
    const currentCell = node.closest ? node.closest('td, th') : null;
    if (currentCell && e.key === 'Tab') {
      e.preventDefault(); // Evita perder el foco fuera del editor

      const table = currentCell.closest('table');
      if (!table) return;

      const cells = Array.from(table.querySelectorAll('th, td'));
      const currentIndex = cells.indexOf(currentCell);

      if (e.shiftKey) {
        // Shift + Tab: Ir a la celda anterior
        if (currentIndex > 0) {
          const prevCell = cells[currentIndex - 1];
          focusCell(prevCell);
        }
      } else {
        // Tab: Ir a la siguiente celda
        if (currentIndex < cells.length - 1) {
          const nextCell = cells[currentIndex + 1];
          focusCell(nextCell);
        } else {
          // Si estamos en la última celda de la tabla, añadir automáticamente una nueva fila
          const colCount = table.rows[0].cells.length;
          const tbody = table.querySelector('tbody') || table;
          const newRow = document.createElement('tr');
          for (let i = 0; i < colCount; i++) {
            const newTd = document.createElement('td');
            newTd.innerHTML = '<br>';
            newRow.appendChild(newTd);
          }
          tbody.appendChild(newRow);
          focusCell(newRow.cells[0]);
          markPendingChanges();
        }
      }
      return;
    }

    // --- 2. COMPORTAMIENTO NATIVO PARA CHECKLISTS (ENTER / BACKSPACE) ---
    const checklistItem = node.closest ? node.closest('.apple-checklist-item') : null;
    if (checklistItem) {
      const textSpan = checklistItem.querySelector('.apple-checklist-text');
      const textContent = textSpan ? textSpan.textContent.replace(/\u200B/g, '').trim() : '';

      // Al pulsar ENTER
      if (e.key === 'Enter') {
        e.preventDefault();

        if (textContent === '') {
          const p = document.createElement('p');
          p.innerHTML = '<br>';
          checklistItem.parentNode.replaceChild(p, checklistItem);

          const r = document.createRange();
          r.setStart(p, 0);
          r.collapse(true);
          sel.removeAllRanges();
          sel.addRange(r);
        } else {
          const newItem = document.createElement('div');
          newItem.className = 'apple-checklist-item';

          const newCb = document.createElement('input');
          newCb.type = 'checkbox';
          newCb.className = 'apple-checkbox';
          newCb.setAttribute('contenteditable', 'false');
          newCb.onchange = markPendingChanges;

          const newSpan = document.createElement('span');
          newSpan.className = 'apple-checklist-text';
          newSpan.innerHTML = '<br>';

          newItem.appendChild(newCb);
          newItem.appendChild(newSpan);

          checklistItem.insertAdjacentElement('afterend', newItem);

          const r = document.createRange();
          r.setStart(newSpan, 0);
          r.collapse(true);
          sel.removeAllRanges();
          sel.addRange(r);
        }
        markPendingChanges();
      }
      // Al pulsar BACKSPACE
      else if (e.key === 'Backspace') {
        if (textContent === '' && sel.anchorOffset === 0) {
          e.preventDefault();
          const p = document.createElement('p');
          p.innerHTML = '<br>';
          checklistItem.parentNode.replaceChild(p, checklistItem);

          const r = document.createRange();
          r.setStart(p, 0);
          r.collapse(true);
          sel.removeAllRanges();
          sel.addRange(r);
          markPendingChanges();
        }
      }
    }
  });

  // Función auxiliar para posicionar el cursor y seleccionar el contenido de una celda
  function focusCell(cell) {
    if (!cell) return;
    cell.focus();
    const range = document.createRange();
    const sel = window.getSelection();
    range.selectNodeContents(cell);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 3. Insertar Tabla con filas y columnas personalizadas
  function insertTable() {
    const editor = document.getElementById('editor');
    editor.focus();

    // Solicitar número de columnas
    let colsInput = prompt('Introduce el número de columnas:', '2');
    if (colsInput === null) return; // Si el usuario cancela, no hace nada
    let cols = parseInt(colsInput, 10);
    if (isNaN(cols) || cols < 1) cols = 2; // Valor por defecto ante entradas inválidas

    // Solicitar número de filas
    let rowsInput = prompt('Introduce el número de filas:', '2');
    if (rowsInput === null) return; // Si el usuario cancela, no hace nada
    let rows = parseInt(rowsInput, 10);
    if (isNaN(rows) || rows < 1) rows = 2; // Valor por defecto ante entradas inválidas

    // Límite de seguridad razonable para evitar bloquear la página
    cols = Math.min(cols, 20);
    rows = Math.min(rows, 50);

    // Construcción dinámica de la cabecera (primera fila)
    let tableHtml = '<table class="apple-notes-table"><tbody><tr>';
    for (let c = 1; c <= cols; c++) {
      tableHtml += `<th>Columna ${c}</th>`;
    }
    tableHtml += '</tr>';

    // Construcción dinámica del resto de filas
    for (let r = 1; r < rows; r++) {
      tableHtml += '<tr>';
      for (let c = 1; c <= cols; c++) {
        tableHtml += '<td><br></td>';
      }
      tableHtml += '</tr>';
    }

    tableHtml += '</tbody></table><p><br></p>';

    // Inserción en el editor
    document.execCommand('insertHTML', false, tableHtml);
    markPendingChanges();
  }

  // 4. Exportar Nota a PDF Vertical con Maquetación Editorial (Sin URL inferior)
  function exportNoteToPDF() {
    const activeNote = notes.find(n => n.id === activeNoteId);
    if (!activeNote) {
      alert('Selecciona una nota para exportar');
      return;
    }

    const { title } = extractNoteLines(activeNote.body);
    const dateFormatted = new Date(activeNote.updatedAt || activeNote.createdAt).toLocaleString('es-ES', {
      day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });

    const tempContainer = document.createElement('div');
    tempContainer.innerHTML = activeNote.body || '';

    const currentCheckboxes = document.querySelectorAll('#editor .apple-checkbox');
    const tempCheckboxes = tempContainer.querySelectorAll('.apple-checkbox');
    tempCheckboxes.forEach((cb, idx) => {
      const isChecked = currentCheckboxes[idx] ? currentCheckboxes[idx].checked : cb.hasAttribute('checked');
      const checkIcon = document.createElement('span');
      checkIcon.className = `pdf-check-icon ${isChecked ? 'checked' : ''}`;
      cb.parentNode.replaceChild(checkIcon, cb);
    });

    const printFrame = document.createElement('iframe');
    printFrame.style.position = 'fixed';
    printFrame.style.right = '0';
    printFrame.style.bottom = '0';
    printFrame.style.width = '0';
    printFrame.style.height = '0';
    printFrame.style.border = '0';
    document.body.appendChild(printFrame);

    const doc = printFrame.contentWindow.document;
    doc.open();
    doc.write(`
      <!DOCTYPE html>
      <html lang="es">
      <head>

        <title>${title}</title>
        <style>
          @page {
            size: A4 portrait;
            margin: 0; /* Al estar a 0 oculta la URL y datos del navegador */
          }
          * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
          }
          body {
            margin: 0;
            padding: 20mm 20mm 20mm 20mm;
            color: #1c1c1e;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            font-size: 11pt;
            line-height: 1.65;

          }
          .pdf-document-wrapper {
            max-width: 100%;
            margin: 0 auto;
          }
          .pdf-header-meta {
            font-size: 9pt;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8e8e93;
            border-bottom: 1px solid #d1d1d6;
            padding-bottom: 8px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
          }
          h1 {
            font-size: 20pt;
            font-weight: 700;
            color: #000000;
            margin: 0 0 16px 0;
            line-height: 1.25;
            page-break-after: avoid;
          }
          h2 {
            font-size: 15pt;
            font-weight: 600;
            color: #1c1c1e;
            margin: 20px 0 10px 0;
            page-break-after: avoid;
          }
          h3 {
            font-size: 12.5pt;
            font-weight: 600;
            color: #2c2c2e;
            margin: 16px 0 8px 0;
            page-break-after: avoid;
          }
          p {
            margin: 0 0 10px 0;
            text-align: justify;
            text-justify: inter-word;
          }
          .apple-notes-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 10pt;
            page-break-inside: avoid;
          }
          .apple-notes-table th, 
          .apple-notes-table td {

            margin-top: 3px;

          .pdf-check-icon.checked {
            background-color: #ff9500 !important;

          .pdf-check-icon.checked::after {
            content: '';

            left: 4px;

          }
          .apple-checklist-text {
            flex: 1;
          }
          .hl-cyan   { background-color: #a5f3fc !important; border-radius: 2px; padding: 1px 3px; }
          .hl-pink   { background-color: #fbcfe8 !important; border-radius: 2px; padding: 1px 3px; }
          .hl-orange { background-color: #fed7aa !important; border-radius: 2px; padding: 1px 3px; }

        }

  // 5. Módulo de Dibujo (Canvas)
  let canvas, ctx, isDrawing = false;

  function initDrawing() {
    canvas = document.getElementById('drawing-canvas');
    if (!canvas) return;
    ctx = canvas.getContext('2d');

    const startDraw = (e) => {
      isDrawing = true;
      ctx.beginPath();
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      ctx.moveTo(clientX - rect.left, clientY - rect.top);
    };

    const draw = (e) => {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      ctx.lineTo(clientX - rect.left, clientY - rect.top);
      ctx.strokeStyle = document.getElementById('draw-color').value;
      ctx.lineWidth = document.getElementById('draw-width').value;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    };

    const stopDraw = () => { isDrawing = false; };

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDraw);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
    canvas.addEventListener('touchend', stopDraw);
  }

  function openDrawingModal() {
    const modal = document.getElementById('drawing-modal');
    modal.classList.remove('hidden');
    initDrawing();
    clearDrawingCanvas();
  }

  function closeDrawingModal() {
    document.getElementById('drawing-modal').classList.add('hidden');
  }

  function clearDrawingCanvas() {
    if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function saveDrawingToNote() {
    if (!canvas) return;
    const dataUrl = canvas.toDataURL('image/png');
    const imgHtml = `<p><img src="${dataUrl}" style="max-width:100%; border-radius:8px; margin:8px 0;"></p><p><br></p>`;
    document.getElementById('editor').focus();
    document.execCommand('insertHTML', false, imgHtml);
    closeDrawingModal();
    markPendingChanges();
  }

  // Carga inicial
  renderFolders();
  renderNotesList();
  if (activeNoteId) selectNote(activeNoteId);
  fetchChangesFromCloud(false);
</script>
