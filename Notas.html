<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notas - Apple UI</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-window: #fbfbfd;
      --bg-sidebar: #f5f5f7;
      --bg-item-active: #e8e8ed;
      --border-color: #e5e5ea;
      --text-main: #1d1d1f;
      --text-muted: #86868b;
      --apple-yellow: #f5a623;
      --apple-orange: #ff9500;
      --apple-red: #ff3b30;
      --apple-green: #34c759;
      --apple-blue: #007aff;
      --apple-purple: #af52de;
      --apple-cyan: #5ac8fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-window);
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .notes-app {
      width: 100vw;
      height: 100vh;
      background: var(--bg-window);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* PANTALLA DE CARGA INICIAL DIFUMINADA */
    .sync-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .sync-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .apple-spinner {
      width: 46px;
      height: 46px;
      border: 3.5px solid #e5e5ea;
      border-top: 3.5px solid var(--apple-blue);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin-bottom: 16px;
    }

    .sync-overlay-text {
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
      letter-spacing: -0.2px;
    }

    /* BARRA SUPERIOR */
    .top-toolbar {
      height: 52px;
      background: #fbfbfd;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      user-select: none;
      z-index: 10;
    }

    .btn-back-nav {
      background-color: #4a5568;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: 7px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    .btn-back-nav:hover { background-color: #374151; }
    .btn-back-nav:active { transform: scale(0.97); }

    .btn-icon {
      background: none;
      border: none;
      color: #48484a;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .btn-icon:hover { background: rgba(0,0,0,0.06); }
    .btn-icon:active { background: rgba(0,0,0,0.1); }
    .btn-icon.active-pinned { color: var(--apple-orange); }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .btn-icon.syncing svg,
    .btn-icon.syncing i {
      animation: spin 0.8s linear infinite;
      color: var(--apple-blue);
    }

    .folder-title-display {
      display: flex;
      flex-direction: column;
      min-width: 110px;
      margin-left: 4px;
    }

    .folder-title-display h4 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }
    .folder-title-display span {
      font-size: 11px;
      color: var(--text-muted);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 10px;
    }

    .search-box {
      margin-left: auto;
      position: relative;
      width: 220px;
      display: flex;
      align-items: center;
    }

    .search-box input {
      width: 100%;
      background: #e3e3e8;
      border: none;
      border-radius: 8px;
      padding: 6px 12px 6px 30px;
      font-size: 13px;
      outline: none;
      height: 30px;
    }

    .search-box svg {
      position: absolute;
      left: 8px;
      width: 15px;
      height: 15px;
      color: #8e8e93;
      pointer-events: none;
    }

    .color-picker {
      display: flex;
      gap: 4px;
      padding: 4px 8px;
      background: #f0f0f4;
      border-radius: 8px;
    }

    .color-swatch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .main-workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .sidebar-folders {
      width: 220px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: width 0.25s ease, opacity 0.2s ease;
    }

    .sidebar-folders.collapsed {
      width: 0;
      opacity: 0;
      pointer-events: none;
    }

    .folder-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
      list-style: none;
    }

    .folder-item {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border-radius: 7px;
      color: var(--text-main);
      font-size: 13px;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      margin-bottom: 2px;
      transition: background 0.15s ease, outline 0.15s ease;
    }

    .folder-item:hover { background: rgba(0,0,0,0.04); }
    .folder-item.active {
      background: #e1e1e6;
      font-weight: 600;
    }

    .folder-item.drag-target {
      background: rgba(0, 122, 255, 0.15) !important;
      outline: 2px dashed var(--apple-blue);
    }

    .folder-item span.count {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
    }

    .new-folder-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      color: var(--apple-orange);
      font-size: 13px;
      font-weight: 500;
      border-top: 1px solid var(--border-color);
      cursor: pointer;
      background: none;
      border: none;
      width: 100%;
      text-align: left;
    }

    .notes-list-pane {
      width: 290px;
      background: #fbfbfd;
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .group-section {
      display: flex;
      flex-direction: column;
    }

    .group-header {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 10px 14px 4px 14px;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .group-header:hover { color: var(--text-main); }

    .group-header-left {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .group-arrow {
      transition: transform 0.2s ease;
      display: inline-flex;
    }

    .group-section.collapsed .group-arrow {
      transform: rotate(-90deg);
    }

    .group-cards-container {
      display: flex;
      flex-direction: column;
    }

    .group-section.collapsed .group-cards-container {
      display: none;
    }

    .note-card {
      margin: 2px 10px 4px 10px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: grab;
      position: relative;
      transition: background 0.1s ease, opacity 0.15s ease;
      user-select: none;
    }

    .note-card:active { cursor: grabbing; }
    .note-card.dragging { opacity: 0.4; }
    .note-card:hover { background: #f2f2f7; }
    .note-card.active { background: #e8e8ed; }

    .note-card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 2px;
    }

    .note-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .btn-pin-card {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      display: flex;
      align-items: center;
      opacity: 0.4;
      transition: opacity 0.15s, color 0.15s, transform 0.1s;
    }

    .btn-pin-card:hover {
      opacity: 1;
      transform: scale(1.1);
      color: var(--apple-orange);
    }

    .btn-pin-card.is-pinned {
      opacity: 1;
      color: var(--apple-orange);
    }

    .note-card-meta {
      display: flex;
      font-size: 12px;
      gap: 6px;
      color: var(--text-muted);
    }

    .note-card-date {
      color: var(--text-main);
      font-weight: 500;
      flex-shrink: 0;
    }

    .note-card-preview {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      padding: 24px 40px;
      overflow-y: auto;
    }

    .editor-header-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #f0f0f2;
      padding-bottom: 8px;
    }

    .editor-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .note-content {
      font-size: 16px;
      line-height: 1.6;
      color: #1d1d1f;
      outline: none;
      min-height: 100%;
    }

    .note-content h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .note-content p { margin-bottom: 12px; }

    .hl-cyan   { background-color: #a5f3fc; border-radius: 4px; padding: 0 4px; }
    .hl-pink   { background-color: #fbcfe8; border-radius: 4px; padding: 0 4px; }
    .hl-orange { background-color: #fed7aa; border-radius: 4px; padding: 0 4px; }
    .hl-green  { background-color: #bbf7d0; border-radius: 4px; padding: 0 4px; }
    .hl-yellow { background-color: #fef08a; border-radius: 4px; padding: 0 4px; }
  </style>
</head>
<body>

<!-- OVERLAY DE SINCRONIZACIÓN -->
<div id="sync-overlay" class="sync-overlay">
  <div class="apple-spinner"></div>
  <div class="sync-overlay-text">Sincronizando datos...</div>
</div>

<div class="notes-app">
  <div class="top-toolbar">
    <button onclick="window.history.back()" class="btn-back-nav" title="Volver atrás">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m12 8-4 4 4 4"/><path d="M16 12H8"/></svg>
      <span>Volver</span>
    </button>

    <button class="btn-icon" id="toggle-sidebar" title="Alternar Barra Lateral">
      <i data-lucide="panel-left"></i>
    </button>

    <div class="folder-title-display">
      <h4 id="current-folder-title">Todas las notas</h4>
      <span id="note-count-display">0 notas</span>
    </div>

    <div class="toolbar-actions">
      <button class="btn-icon" id="btn-new-note" title="Nueva Nota">
        <i data-lucide="square-pen" style="color: var(--apple-orange)"></i>
      </button>

      <button class="btn-icon" id="btn-pin-note" title="Fijar / Desfijar Nota" onclick="togglePinCurrentNote()">
        <i data-lucide="pin"></i>
      </button>

      <button class="btn-icon" id="btn-delete-note" title="Eliminar Nota">
        <i data-lucide="trash-2"></i>
      </button>

      <div class="color-picker">
        <span class="color-swatch" style="background:#5ac8fa;" onclick="applyHighlight('hl-cyan')" title="Cian"></span>
        <span class="color-swatch" style="background:#ff2d55;" onclick="applyHighlight('hl-pink')" title="Rosa"></span>
        <span class="color-swatch" style="background:#ff9500;" onclick="applyHighlight('hl-orange')" title="Naranja"></span>
        <span class="color-swatch" style="background:#34c759;" onclick="applyHighlight('hl-green')" title="Verde"></span>
        <span class="color-swatch" style="background:#ffd60a;" onclick="applyHighlight('hl-yellow')" title="Amarillo"></span>
      </div>

      <button class="btn-icon" onclick="formatDoc('bold')" title="Negrita"><b>B</b></button>
      <button class="btn-icon" onclick="formatDoc('insertUnorderedList')" title="Lista"><i data-lucide="list"></i></button>

      <button class="btn-icon" id="btn-sync" onclick="syncWithCloud(true)" title="Sincronizar con Google Sheets">
        <i data-lucide="rotate-cw"></i>
      </button>
    </div>

    <div class="search-box">
      <i data-lucide="search"></i>
      <input type="text" id="search-input" placeholder="Buscar">
    </div>
  </div>

  <div class="main-workspace">
    <div class="sidebar-folders" id="sidebar-folders">
      <ul class="folder-list" id="folder-list"></ul>
      <button class="new-folder-btn" onclick="createNewFolder()">
        <i data-lucide="folder-plus" style="width:16px;"></i> Nueva Carpeta
      </button>
    </div>

    <div class="notes-list-pane" id="notes-list-pane"></div>

    <div class="editor-pane">
      <div class="editor-header-bar">
        <div class="editor-date" id="editor-date-label">Selecciona una nota</div>
      </div>
      <div class="note-content" id="editor" contenteditable="true" spellcheck="false"></div>
    </div>
  </div>
</div>

<script>
  const SYNC_API_URL = 'https://script.google.com/macros/s/AKfycbyiGklO6RqOffvlI8pCWD6qRJaWzZYLaycWm61eHO8SnszEQstgo-awHG4FAYg2A6klWQ/exec';

  let folders = JSON.parse(localStorage.getItem('apple_notes_folders')) || [
    { id: 'all', name: 'Todas las notas', icon: 'folder' },
    { id: 'projects', name: 'Proyectos', icon: 'folder' },
    { id: 'notes', name: 'Notas', icon: 'folder' }
  ];

  let notes = JSON.parse(localStorage.getItem('apple_notes_data')) || [];
  let deletedNoteIds = JSON.parse(localStorage.getItem('apple_notes_deleted')) || [];

  let currentFolderId = 'all';
  let activeNoteId = notes.length > 0 ? notes[0].id : null;
  let draggedNoteId = null;
  let isSyncing = false;
  let hasLocalChanges = false;
  let pendingSync = false;
  let autoSaveTimeout = null;
  let collapsedSections = JSON.parse(localStorage.getItem('apple_notes_collapsed')) || {};

  function hideOverlay() {
    const overlay = document.getElementById('sync-overlay');
    if (overlay && !overlay.classList.contains('hidden')) {
      overlay.classList.add('hidden');
    }
  }

  function renderFolders() {
    const list = document.getElementById('folder-list');
    list.innerHTML = '';

    folders.forEach(f => {
      const count = f.id === 'all' ? notes.length : notes.filter(n => n.folderId === f.id).length;
      const li = document.createElement('li');
      li.className = `folder-item ${f.id === currentFolderId ? 'active' : ''}`;
      li.dataset.folderId = f.id;
      li.innerHTML = `
        <i data-lucide="${f.icon || 'folder'}" style="width:16px;"></i>
        <span>${f.name}</span>
        <span class="count">${count}</span>
      `;

      li.onclick = () => {
        currentFolderId = f.id;
        document.getElementById('current-folder-title').innerText = f.name;
        renderFolders();
        renderNotesList();
      };

      li.ondblclick = () => {
        if (f.id === 'all') return;
        const nuevoNombre = prompt('Cambiar nombre de la carpeta:', f.name);
        if (nuevoNombre && nuevoNombre.trim() !== '') {
          f.name = nuevoNombre.trim();
          markChangedAndSave(true);
          renderFolders();
          if (currentFolderId === f.id) {
            document.getElementById('current-folder-title').innerText = f.name;
          }
        }
      };

      li.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (f.id !== 'all') li.classList.add('drag-target');
      });

      li.addEventListener('dragleave', () => {
        li.classList.remove('drag-target');
      });

      li.addEventListener('drop', (e) => {
        e.preventDefault();
        li.classList.remove('drag-target');
        if (draggedNoteId && f.id !== 'all') {
          const note = notes.find(n => n.id === draggedNoteId);
          if (note) {
            note.folderId = f.id;
            note.updatedAt = new Date().toISOString();
            markChangedAndSave(true);
            renderFolders();
            renderNotesList();
          }
        }
      });

      list.appendChild(li);
    });
    lucide.createIcons();
  }

  function getNoteCategory(noteDate, isPinned) {
    if (isPinned) return 'Fijadas';
    const now = new Date();
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    
    if (noteDate >= startOfToday) return 'Hoy';

    const thirtyDaysAgo = new Date();
    thirtyDaysAgo.setDate(now.getDate() - 30);
    if (noteDate >= thirtyDaysAgo) return 'Últimos 30 días';

    const monthName = noteDate.toLocaleString('es-ES', { month: 'long', year: 'numeric' });
    return monthName.charAt(0).toUpperCase() + monthName.slice(1);
  }

  function toggleSection(groupId) {
    collapsedSections[groupId] = !collapsedSections[groupId];
    localStorage.setItem('apple_notes_collapsed', JSON.stringify(collapsedSections));
    renderNotesList();
  }

  function togglePinNote(id, event) {
    if (event) event.stopPropagation();
    const note = notes.find(n => n.id === id);
    if (note) {
      note.pinned = !note.pinned;
      note.updatedAt = new Date().toISOString();
      markChangedAndSave(true);
      renderNotesList();
      updatePinButtonState();
    }
  }

  function togglePinCurrentNote() {
    if (activeNoteId) togglePinNote(activeNoteId);
  }

  function updatePinButtonState() {
    const pinBtn = document.getElementById('btn-pin-note');
    if (!pinBtn) return;
    const activeNote = notes.find(n => n.id === activeNoteId);
    if (activeNote && activeNote.pinned) {
      pinBtn.classList.add('active-pinned');
    } else {
      pinBtn.classList.remove('active-pinned');
    }
  }

  function renderNotesList() {
    const container = document.getElementById('notes-list-pane');
    const query = document.getElementById('search-input').value.toLowerCase();
    container.innerHTML = '';

    let filtered = notes.filter(n => {
      const matchesFolder = currentFolderId === 'all' || n.folderId === currentFolderId;
      const matchesSearch = (n.title || '').toLowerCase().includes(query) || (n.body || '').toLowerCase().includes(query);
      return matchesFolder && matchesSearch;
    });

    filtered.sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));
    document.getElementById('note-count-display').innerText = `${filtered.length} notas`;

    const groups = {};
    const groupOrder = [];

    filtered.forEach(note => {
      const dateObj = new Date(note.updatedAt || note.createdAt || Date.now());
      const groupName = getNoteCategory(dateObj, !!note.pinned);

      if (!groups[groupName]) {
        groups[groupName] = [];
        groupOrder.push(groupName);
      }
      groups[groupName].push(note);
    });

    if (groupOrder.includes('Fijadas')) {
      groupOrder.splice(groupOrder.indexOf('Fijadas'), 1);
      groupOrder.unshift('Fijadas');
    }

    groupOrder.forEach(groupName => {
      const groupSection = document.createElement('div');
      groupSection.className = `group-section ${collapsedSections[groupName] ? 'collapsed' : ''}`;

      const groupHeader = document.createElement('div');
      groupHeader.className = 'group-header';
      groupHeader.onclick = () => toggleSection(groupName);

      groupHeader.innerHTML = `
        <div class="group-header-left">
          <span class="group-arrow"><i data-lucide="chevron-down" style="width:14px; height:14px;"></i></span>
          <span>${groupName}</span>
        </div>
        <span style="font-size:10px; opacity:0.7;">${groups[groupName].length}</span>
      `;

      const cardsContainer = document.createElement('div');
      cardsContainer.className = 'group-cards-container';

      groups[groupName].forEach(note => {
        const dateObj = new Date(note.updatedAt || note.createdAt || Date.now());
        const card = document.createElement('div');
        card.className = `note-card ${note.id === activeNoteId ? 'active' : ''}`;
        card.draggable = true;

        card.addEventListener('dragstart', () => {
          draggedNoteId = note.id;
          card.classList.add('dragging');
        });

        card.addEventListener('dragend', () => {
          draggedNoteId = null;
          card.classList.remove('dragging');
        });

        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = note.body || '';
        let textPreview = (tempDiv.textContent || '').replace(note.title || '', '').trim() || 'Sin texto adicional';

        card.innerHTML = `
          <div class="note-card-title-row">
            <div class="note-card-title">${note.title || 'Nueva Nota'}</div>
            <button class="btn-pin-card ${note.pinned ? 'is-pinned' : ''}" title="${note.pinned ? 'Desfijar' : 'Fijar'}" onclick="togglePinNote('${note.id}', event)">
              <i data-lucide="pin" style="width: 13px; height: 13px; transform: ${note.pinned ? 'rotate(45deg)' : 'none'};"></i>
            </button>
          </div>
          <div class="note-card-meta">
            <span class="note-card-date">${formatCardDate(dateObj)}</span>
            <span class="note-card-preview">${textPreview}</span>
          </div>
        `;

        card.onclick = () => selectNote(note.id);
        cardsContainer.appendChild(card);
      });

      groupSection.appendChild(groupHeader);
      groupSection.appendChild(cardsContainer);
      container.appendChild(groupSection);
    });

    updatePinButtonState();
    lucide.createIcons();
  }

  function formatCardDate(date) {
    const now = new Date();
    if (date.toDateString() === now.toDateString()) {
      return date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    }
    return date.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: '2-digit' });
  }

  function selectNote(id) {
    activeNoteId = id;
    const note = notes.find(n => n.id === id);
    const editor = document.getElementById('editor');
    
    if (note) {
      editor.innerHTML = note.body || '';
      const dateFormatted = new Date(note.updatedAt || note.createdAt).toLocaleString('es-ES', {
        day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
      document.getElementById('editor-date-label').innerText = `Creada / Modificada: ${dateFormatted}`;
    } else {
      editor.innerHTML = '';
      document.getElementById('editor-date-label').innerText = '';
    }
    renderNotesList();
    updatePinButtonState();
  }

  function markChangedAndSave(immediate = false) {
    hasLocalChanges = true;
    saveLocal();
    clearTimeout(autoSaveTimeout);
    if (immediate) {
      syncWithCloud(true);
    } else {
      // Envío ultrarrápido a los 150ms
      autoSaveTimeout = setTimeout(() => {
        syncWithCloud(true);
      }, 150);
    }
  }

  function updateActiveNoteFromEditor() {
    const activeNote = notes.find(n => n.id === activeNoteId);
    if (!activeNote) return;

    activeNote.body = document.getElementById('editor').innerHTML;
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = activeNote.body;
    
    const lines = (tempDiv.innerText || tempDiv.textContent || '').split('\n').map(l => l.trim()).filter(Boolean);
    activeNote.title = lines.length > 0 ? lines[0].slice(0, 40) : 'Nueva Nota';
    activeNote.updatedAt = new Date().toISOString();

    markChangedAndSave(false);
    renderNotesList();
  }

  document.getElementById('editor').addEventListener('input', updateActiveNoteFromEditor);
  document.getElementById('editor').addEventListener('keyup', updateActiveNoteFromEditor);

  document.getElementById('editor').addEventListener('blur', () => {
    if (hasLocalChanges) {
      markChangedAndSave(true);
    }
  });

  document.getElementById('btn-new-note').addEventListener('click', () => {
    const now = new Date().toISOString();
    const newNote = {
      id: 'n_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
      folderId: currentFolderId === 'all' ? 'notes' : currentFolderId,
      title: 'Nueva Nota',
      body: '<h1>Nueva Nota</h1><p></p>',
      createdAt: now,
      updatedAt: now,
      pinned: false
    };
    notes.unshift(newNote);
    activeNoteId = newNote.id;
    markChangedAndSave(true);
    renderNotesList();
    renderFolders();
    selectNote(newNote.id);
    document.getElementById('editor').focus();
  });

  document.getElementById('btn-delete-note').addEventListener('click', () => {
    if (!activeNoteId) return;
    
    if (!deletedNoteIds.includes(activeNoteId)) {
      deletedNoteIds.push(activeNoteId);
      localStorage.setItem('apple_notes_deleted', JSON.stringify(deletedNoteIds));
    }
    
    notes = notes.filter(n => n.id !== activeNoteId);
    activeNoteId = notes.length > 0 ? notes[0].id : null;
    markChangedAndSave(true);
    renderNotesList();
    renderFolders();
    if (activeNoteId) selectNote(activeNoteId);
    else {
      document.getElementById('editor').innerHTML = '';
      document.getElementById('editor-date-label').innerText = '';
    }
  });

  function createNewFolder() {
    const folderName = prompt('Nombre de la nueva carpeta:');
    if (!folderName) return;
    folders.push({
      id: 'f_' + Date.now(),
      name: folderName,
      icon: 'folder'
    });
    markChangedAndSave(true);
    renderFolders();
  }

  function formatDoc(cmd, value = null) {
    document.execCommand(cmd, false, value);
    markChangedAndSave(true);
  }

  function applyHighlight(className) {
    const selection = window.getSelection();
    if (!selection.rangeCount) return;
    const range = selection.getRangeAt(0);
    const span = document.createElement('span');
    span.className = className;
    span.appendChild(range.extractContents());
    range.insertNode(span);
    document.getElementById('editor').dispatchEvent(new Event('input'));
    markChangedAndSave(true);
  }

  document.getElementById('toggle-sidebar').addEventListener('click', () => {
    document.getElementById('sidebar-folders').classList.toggle('collapsed');
  });

  document.getElementById('search-input').addEventListener('input', renderNotesList);

  function saveLocal() {
    localStorage.setItem('apple_notes_data', JSON.stringify(notes));
    localStorage.setItem('apple_notes_folders', JSON.stringify(folders));
  }

  // --- MOTOR DE SINCRONIZACIÓN EN TIEMPO REAL ---
  async function syncWithCloud(forcePush = false) {
    if (isSyncing) {
      if (forcePush || hasLocalChanges) pendingSync = true;
      return;
    }
    isSyncing = true;

    const syncBtn = document.getElementById('btn-sync');
    if (syncBtn) syncBtn.classList.add('syncing');

    try {
      if (hasLocalChanges || forcePush) {
        hasLocalChanges = false;
        await fetch(SYNC_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ notes, folders })
        });
      }

      // Descarga desde la nube sin caché
      const response = await fetch(`${SYNC_API_URL}?t=${Date.now()}`);
      const data = await response.json();

      let cloudNotes = (data && Array.isArray(data.notes)) ? data.notes : [];
      let cloudFolders = (data && Array.isArray(data.folders)) ? data.folders : [];

      cloudNotes = cloudNotes.filter(n => !deletedNoteIds.includes(String(n.id)));

      const mergedNotesMap = new Map();
      cloudNotes.forEach(n => mergedNotesMap.set(String(n.id), n));

      notes.forEach(localNote => {
        if (deletedNoteIds.includes(String(localNote.id))) return;
        const cloudNote = mergedNotesMap.get(String(localNote.id));
        if (!cloudNote) {
          mergedNotesMap.set(String(localNote.id), localNote);
        } else {
          const localTime = new Date(localNote.updatedAt || localNote.createdAt || 0).getTime();
          const cloudTime = new Date(cloudNote.updatedAt || cloudNote.createdAt || 0).getTime();
          if (localTime >= cloudTime) {
            mergedNotesMap.set(String(localNote.id), localNote);
          }
        }
      });

      notes = Array.from(mergedNotesMap.values());

      const mergedFoldersMap = new Map();
      cloudFolders.forEach(f => mergedFoldersMap.set(String(f.id), f));
      folders.forEach(f => {
        if (!mergedFoldersMap.has(String(f.id))) {
          mergedFoldersMap.set(String(f.id), f);
        }
      });
      if (mergedFoldersMap.size > 0) {
        folders = Array.from(mergedFoldersMap.values());
      }

      saveLocal();
      renderFolders();
      renderNotesList();

      const isEditing = document.activeElement === document.getElementById('editor');
      if (!isEditing) {
        if (!activeNoteId && notes.length > 0) {
          activeNoteId = notes[0].id;
        }
        if (activeNoteId) {
          const currentNote = notes.find(n => n.id === activeNoteId);
          if (currentNote) {
            document.getElementById('editor').innerHTML = currentNote.body || '';
            const dateFormatted = new Date(currentNote.updatedAt || currentNote.createdAt).toLocaleString('es-ES', {
              day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });
            document.getElementById('editor-date-label').innerText = `Creada / Modificada: ${dateFormatted}`;
          }
        }
      }
    } catch (err) {
      console.warn('Aviso sincronización:', err);
    } finally {
      isSyncing = false;
      if (syncBtn) syncBtn.classList.remove('syncing');
      hideOverlay();

      if (pendingSync) {
        pendingSync = false;
        syncWithCloud(true);
      }
    }
  }

  // Renderizado inicial
  renderFolders();
  renderNotesList();
  if (activeNoteId) selectNote(activeNoteId);

  setTimeout(hideOverlay, 300);

  // Sincronización instantánea al arrancar
  syncWithCloud(false);

  // Sincronización continua de fondo cada 2 segundos (máxima inmediatez)
  setInterval(() => {
    syncWithCloud(false);
  }, 2000);

  // Sincronizaciones activadas por interacción en iPad / PC
  window.addEventListener('focus', () => syncWithCloud(false));
  window.addEventListener('online', () => syncWithCloud(true));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      syncWithCloud(false);
    }
  });
  document.addEventListener('touchstart', () => {
    if (!isSyncing && !hasLocalChanges) syncWithCloud(false);
  }, { passive: true });
</script>
</body>
</html>
